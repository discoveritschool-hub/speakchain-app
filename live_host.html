<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakChain · Екран ведучого</title>
<style>
:root{--bg:#120f1d;--panel:#1e192d;--ink:#f7f3ff;--muted:#aaa0c2;--purple:#9c7cff;--green:#45d59a;--line:#373047}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#302352,#120f1d 55%);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}.stage{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:3vh 4vw;gap:2vh}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:2.1vw}.live{color:#ff6c82;font-size:1.2vw;font-weight:900;letter-spacing:.12em}.lesson{color:var(--muted);font-size:1.2vw}.main{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(280px,.8fr);gap:2.2vw;min-height:0}.task,.stats{background:#1d182bcc;border:1px solid var(--line);border-radius:2vw;padding:2.6vw;box-shadow:0 2vw 6vw #0006}.eyebrow{color:var(--purple);font-size:1.15vw;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.prompt{font-size:3vw;line-height:1.16;font-weight:900;margin:1.4vw 0 2vw}.privacy{background:#2a2240;padding:.8vw 1vw;border-radius:.8vw;color:#cbbefa;font-size:1vw;margin-bottom:1.2vw}.option{position:relative;border:2px solid var(--line);border-radius:1.1vw;padding:1.15vw 1.35vw;margin:.75vw 0;font-size:1.45vw;font-weight:750}.option.answer{border-color:var(--green);background:#174432}.count{float:right;color:var(--muted)}.stats h2{font-size:1.65vw;margin:.2vw 0 1.4vw}.big{font-size:4.5vw;font-weight:950;color:var(--green)}.bar{height:1vw;background:#332b45;border-radius:2vw;overflow:hidden;margin:.6vw 0 1.6vw}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7258dc,var(--green));width:0}.note{font-size:1vw;color:var(--muted);line-height:1.5}.controls{display:flex;align-items:center;justify-content:center;gap:1vw}.controls button{border:1px solid var(--line);background:#272039;color:white;border-radius:1vw;padding:.85vw 1.5vw;font:800 1.05vw system-ui;cursor:pointer}.controls .primary{background:#7357df;border-color:#7357df}.controls button:disabled{opacity:.35}.step{color:var(--muted);font-size:1vw;min-width:7vw;text-align:center}.error{display:grid;place-items:center;font-size:2vw;text-align:center}
@media(max-width:850px){.main{grid-template-columns:1fr}.stats{display:none}.logo{font-size:22px}.live,.lesson{font-size:12px}.prompt{font-size:30px}.eyebrow{font-size:12px}.option{font-size:17px;padding:14px}.privacy,.note,.controls button,.step{font-size:12px}.stage{padding:20px}.task{padding:24px;border-radius:22px}}
</style></head><body><main class="stage"><header class="head"><div><span class="logo">SpeakChain</span> <span class="live">● LIVE</span></div><div class="lesson" id="lesson">Завантаження…</div></header><section class="main" id="main"><div class="task"><div class="eyebrow">Екран відкритого уроку</div><div class="prompt">Підключаємо завдання…</div></div></section><footer class="controls"><button id="prev">← Назад</button><span class="step" id="position"></span><button class="primary" id="next">Далі →</button><button id="reveal">Показати відповідь</button><button id="full">На весь екран</button></footer></main>
<script>
(()=>{'use strict';const q=new URLSearchParams(location.search),code=(q.get('session')||'').toUpperCase(),api=(q.get('api')||'https://robust-grace-production-dee4.up.railway.app').replace(/\/$/,''),token=q.get('host_token')||'';const $=id=>document.getElementById(id);let data=null,index=0,reveal=false,busy=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function hostText(s){return String(s||'').replace(/\{\{lexicon_(\d+)\}\}/g,(_,n)=>`особиста фраза учня №${n}`)}async function call(path,opts={}){const sep=path.includes('?')?'&':'?',r=await fetch(api+path+sep+'host_token='+encodeURIComponent(token),Object.assign({headers:{'Content-Type':'application/json'}},opts)),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Не вдалося підключити екран');return d}function steps(){return data?.activity?.spec?.steps||[]}function current(){return steps()[index]||null}function answerKey(st){return new Set((st.options||[]).filter(x=>x.correct).map(x=>x.id))}
function render(){const st=current();if(!st)return;$('lesson').textContent=data.session.title;$('position').textContent=`${index+1} / ${steps().length}`;$('prev').disabled=index===0;$('next').disabled=index===steps().length-1;$('reveal').disabled=st.type==='information';$('reveal').textContent=reveal?'Сховати відповідь':'Показати відповідь';const stat=data.step_stats?.[st.id]||{responses:0,correct:0,correct_percent:0,answers:{}};const key=answerKey(st),personal=/\{\{lexicon_/.test(JSON.stringify(st));let options='';if(st.options)options=st.options.map(o=>`<div class="option ${reveal&&key.has(o.id)?'answer':''}">${esc(hostText(o.label))}<span class="count">${Number(stat.answers?.[o.id]||0)}</span></div>`).join('');$('main').innerHTML=`<article class="task"><div class="eyebrow">${esc(data.activity.title)}</div><div class="prompt">${esc(hostText(st.prompt||st.title||data.activity.title))}</div>${personal?'<div class="privacy">🔒 На телефоні кожного учня тут стоїть його власна SRS-фраза. На ефір приватні слова не передаються.</div>':''}${st.type==='information'?`<p>${esc(st.body||'')}</p>`:options}${reveal&&st.explanation?`<p class="note"><b>Пояснення:</b> ${esc(st.explanation)}</p>`:''}</article><aside class="stats"><div class="eyebrow">Відповіді наживо</div><div class="big">${Number(stat.responses||0)}</div><h2>учнів відповіли</h2><div class="bar"><i style="width:${Number(stat.correct_percent||0)}%"></i></div><h2>${Number(stat.correct_percent||0)}% правильно</h2><p class="note">Відображається лише агрегована статистика. Імена та особиста лексика учнів приховані.</p></aside>`}
async function setStep(){if(busy)return;busy=true;try{await call(`/api/v1/live-sessions/${code}/host/step`,{method:'POST',body:JSON.stringify({step_id:current().id})})}finally{busy=false}}async function move(delta){const next=Math.max(0,Math.min(steps().length-1,index+delta));if(next===index)return;index=next;reveal=false;render();await setStep()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reveal').onclick=()=>{reveal=!reveal;render()};$('full').onclick=()=>document.documentElement.requestFullscreen?.();
async function poll(){try{const fresh=await call(`/api/v1/live-sessions/${code}/host`),id=fresh.control?.current_step_id;data=fresh;if(id){const found=steps().findIndex(x=>x.id===id);if(found>=0)index=found}else if(!busy){index=0;await setStep()}render()}catch(e){$('main').innerHTML=`<div class="task error">${esc(e.message)}</div>`}setTimeout(poll,1500)}if(!code||!token)$('main').innerHTML='<div class="task error">Немає коду сесії або ключа ведучого.</div>';else poll()})();
</script></body></html>
