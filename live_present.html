<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakChain · Екран YouTube</title>
<style>
:root{--bg:#100d19;--panel:#1d182b;--ink:#faf7ff;--muted:#b9aecf;--purple:#9d7dff;--green:#45d59a;--red:#ff6c82;--line:#3b324d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.stage{width:100vw;height:100vh;padding:4vh 4vw;display:grid;grid-template-rows:auto 1fr;gap:3vh;background:radial-gradient(circle at 82% 8%,#34265a 0,#100d19 55%)}header{display:flex;align-items:center;justify-content:space-between}.logo{font-size:2.2vw;font-weight:950}.live{margin-left:1vw;color:var(--red);font-size:1.15vw;font-weight:950;letter-spacing:.15em}.lesson{font-size:1.2vw;color:var(--muted)}main{min-height:0;display:grid;grid-template-columns:minmax(0,2.1fr) minmax(280px,.75fr);gap:2.2vw}.card{background:#1d182be8;border:1px solid var(--line);border-radius:2vw;padding:2.7vw;box-shadow:0 2vw 7vw #0007;min-height:0}.eyebrow{color:var(--purple);font-weight:950;font-size:1.1vw;text-transform:uppercase;letter-spacing:.1em}.prompt{font-size:3.15vw;line-height:1.14;font-weight:950;margin:1.3vw 0 2vw}.body{font-size:1.55vw;line-height:1.5;color:#ded6ed}.privacy{padding:.9vw 1.1vw;background:#2b2440;border-radius:.9vw;color:#d6c9ff;font-size:1.05vw;margin-bottom:1.2vw}.option{border:2px solid var(--line);border-radius:1.15vw;padding:1.15vw 1.4vw;margin:.8vw 0;font-size:1.55vw;font-weight:800}.count{float:right;color:var(--muted)}.metric{font-size:5vw;color:var(--green);font-weight:950;margin-top:1.5vw}.metric-label{font-size:1.45vw;font-weight:850}.bar{height:1.1vw;background:#362d49;border-radius:2vw;overflow:hidden;margin:1.5vw 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7759e5,var(--green))}.note{font-size:1vw;line-height:1.55;color:var(--muted)}.wide{grid-column:1/-1;overflow:auto}.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;margin-top:1.5vw}.plan-item,.route{background:#272037;border:1px solid var(--line);border-radius:1.1vw;padding:1.2vw}.plan-item b{font-size:1.35vw}.plan-item p,.route p{font-size:.95vw;color:var(--muted);line-height:1.45}.routes{display:grid;grid-template-columns:repeat(5,1fr);gap:.8vw;margin-top:1.5vw}.route h2{font-size:1.25vw;margin:.35vw 0}.route .n{font-size:2.2vw;color:var(--green);font-weight:950}.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:.75vw;margin-top:1vw}.funnel div{text-align:center;background:#2b2440;border-radius:.9vw;padding:.8vw;color:var(--muted);font-size:.9vw}.funnel b{display:block;color:var(--green);font-size:1.8vw}.question{display:grid;place-items:center;text-align:center;height:100%}.question .prompt{max-width:75vw;font-size:4vw}.votes{font-size:1.4vw;color:var(--muted)}.waiting{grid-column:1/-1;display:grid;place-items:center;text-align:center}.waiting .prompt{max-width:65vw}@media(max-width:850px){.logo{font-size:23px}.live,.lesson,.eyebrow,.note,.privacy{font-size:12px}.prompt{font-size:32px}.body,.option{font-size:17px}.stage{padding:22px}.card{padding:24px;border-radius:22px}.plan{grid-template-columns:1fr 1fr}.routes{grid-template-columns:1fr 1fr}.metric{font-size:50px}}
</style></head><body><section class="stage"><header><div><span class="logo">SpeakChain</span><span class="live">● LIVE</span></div><div class="lesson" id="lesson">Підключення…</div></header><main id="main"><section class="card waiting"><div><div class="eyebrow">Екран трансляції</div><div class="prompt">Блогер готує перше завдання…</div></div></section></main></section>
<script>
(()=>{'use strict';const q=new URLSearchParams(location.search),code=(q.get('session')||'').toUpperCase(),api=(q.get('api')||'https://robust-grace-production-dee4.up.railway.app').replace(/\/$/,''),token=q.get('host_token')||'',DISPLAY={plan:'__plan__',routes:'__routes__',questions:'__questions__'},$=id=>document.getElementById(id);let data=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function hostText(s){return String(s||'').replace(/\{\{lexicon_(\d+)\}\}/g,(_,n)=>`особиста фраза учня №${n}`)}async function call(){const r=await fetch(`${api}/api/v1/live-sessions/${encodeURIComponent(code)}/host?host_token=${encodeURIComponent(token)}`,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Не вдалося підключити трансляцію');return d}function steps(){return(data?.activity?.spec?.steps||[]).filter(x=>x.host_visible!==false)}
function renderTask(id){const st=steps().find(x=>x.id===id)||steps()[0];if(!st)return renderWait('Блогер готує перше завдання…');const stat=data.step_stats?.[st.id]||{responses:0,correct_percent:0,answers:{}},personal=/\{\{lexicon_/.test(JSON.stringify(st)),options=(st.options||[]).map(o=>`<div class="option">${esc(hostText(o.label))}<span class="count">${Number(stat.answers?.[o.id]||0)}</span></div>`).join('');$('main').innerHTML=`<article class="card"><div class="eyebrow">${esc(data.activity.title)}</div><div class="prompt">${esc(hostText(st.prompt||st.title||data.activity.title))}</div>${personal?'<div class="privacy">🔒 Кожен учень бачить тут власну актуальну SRS-лексику.</div>':''}${st.type==='information'?`<div class="body">${esc(hostText(st.body||''))}</div>`:options}</article><aside class="card"><div class="eyebrow">Відповіді наживо</div><div class="metric">${Number(stat.responses||0)}</div><div class="metric-label">учнів відповіли</div><div class="bar"><i style="width:${Number(stat.correct_percent||0)}%"></i></div><div class="metric-label">${Number(stat.correct_percent||0)}% правильно</div><p class="note">Лише агрегована статистика. Імена й персональна лексика не потрапляють у трансляцію.</p></aside>`}
function renderPlan(){const run=data?.activity?.spec?.run_of_show||[],mission=data?.activity?.spec?.speaking_mission||{};$('main').innerHTML=`<section class="card wide"><div class="eyebrow">План 60 хвилин</div><div class="prompt">Граматика → фрази → мовлення → відео</div><div class="plan">${run.map(x=>`<article class="plan-item"><b>${Number(x.start_minute)}–${Number(x.start_minute)+Number(x.duration_minutes)} хв · ${esc(x.title)}</b><p>${esc(x.interaction||'')}</p></article>`).join('')}</div><div class="privacy" style="margin-top:1vw"><b>Фінальна відеомісія:</b> ${esc(mission.prompt||'')}</div></section>`}
function renderRoutes(){const routes=data?.activity?.spec?.personal_routes||{},m=data?.personal_learning||{},dist=m.route_distribution||{},order=['A1','A2','B1','B2','C1_C2'];$('main').innerHTML=`<section class="card wide"><div class="eyebrow">Mass Live, Personal Learning</div><div class="prompt">Один ефір · п'ять персональних маршрутів</div><div class="routes">${order.map(key=>{const r=routes[key]||{};return`<article class="route"><div class="n">${Number(dist[key]||0)}</div><h2>${esc(r.label||key)}</h2><p><b>Основна:</b> ${esc(r.main_topic||'—')}<br><b>Підготовча:</b> ${esc(r.preparatory_topic||'—')}<br><b>Повторення:</b> ${esc(r.review_topic||'—')}</p></article>`}).join('')}</div><div class="funnel"><div><b>${Number(m.preparation_completed||0)}</b>підготовка</div><div><b>${Number(m.grammar_completed||0)}</b>граматика</div><div><b>${Number(m.phrases_completed||0)}</b>особисті фрази</div><div><b>${Number(m.speaking_completed||0)}</b>розмова</div><div><b>${Number(m.video_completed||0)}</b>відео</div></div></section>`}
function renderQuestions(){const items=(data?.questions||[]).filter(x=>x.status==='on_air'),fallback=(data?.questions||[]).filter(x=>x.status==='pending').sort((a,b)=>Number(b.votes||0)-Number(a.votes||0)),item=items[0]||fallback[0];if(!item)return renderWait('Поставте питання на своєму екрані — найпопулярніше з’явиться тут.','Q&A потоку');$('main').innerHTML=`<section class="card wide question"><div><div class="eyebrow">Питання учня</div><div class="prompt">${esc(item.question)}</div>${item.answer?`<div class="body"><b>Відповідь:</b> ${esc(item.answer)}</div>`:''}<div class="votes">▲ ${Number(item.votes||0)} підтримали</div></div></section>`}
function renderWait(message,label='Екран трансляції'){$('main').innerHTML=`<section class="card waiting"><div><div class="eyebrow">${esc(label)}</div><div class="prompt">${esc(message)}</div></div></section>`}function render(){if(!data)return;const id=data.control?.current_step_id;$('lesson').textContent=data.session?.title||'Відкритий урок';if(id===DISPLAY.plan)return renderPlan();if(id===DISPLAY.routes)return renderRoutes();if(id===DISPLAY.questions)return renderQuestions();renderTask(id)}async function poll(){try{data=await call();render()}catch(e){renderWait(e.message,'Помилка підключення')}setTimeout(poll,1500)}if(!code||!token)renderWait('Відкрийте цей екран із пульта блогера.','Немає доступу');else poll()})();
</script></body></html>
