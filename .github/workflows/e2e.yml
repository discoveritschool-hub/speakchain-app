name: Critical browser and Telegram E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          node-version: '24.14.0'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and runtime dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate deterministic harness
        run: pnpm run validate:e2e

      - name: Run critical desktop and mobile paths
        run: pnpm run e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
