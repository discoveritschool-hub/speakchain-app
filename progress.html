<!DOCTYPE html>
<html lang="uk">
<head>
  <!-- ── Дизайн-токени: два шари ──────────────────────────────────
       1) inline :root нижче — фундамент. Сторінка НІКОЛИ не побіліє,
          навіть якщо tokens.css не завантажиться.
       2) <link> після нього — головний. Перекриває inline і дає
          класи .sc-card/.sc-btn/.sc-chip. Палітра керується з
          одного файлу: правиш tokens.css → міняється всюди.
       ВАЖЛИВО: шлях БЕЗ початкового слеша. Слеш = корінь домену,
       а сайт живе в підпапці /speakchain-app/ → 404.
  ─────────────────────────────────────────────────────────────── -->

  <style>:root {
  --purple:#7c6ef7;--purple-dark:#5b4bc4;--purple-bg:#241d4d;--purple-text:#c9c2ff;
  --green:#5ad8a6;--green-bg:#1b3229;--red:#f76e6e;--orange:#f7a35c;--gold:#f5c842;
  --silver:#b0b0c0;--bronze:#cd7f32;--yellow:#f7c95c;--blue:#5ab4f7;--telegram:#2ea6da;
  --bg:#0d0d14;--bg-card:#16161f;--bg-card2:#1e1e2a;--bg-card3:#252535;
  --text:#eaeaf5;--text2:#8888a8;--text3:#5a5a72;--line:#2a2a3a;
  --r-sm:8px;--r:12px;--r-lg:20px;--r-pill:999px;
  --fs-xs:11px;--fs-sm:12px;--fs:14px;--fs-md:16px;--fs-lg:20px;--fs-xl:28px;
  --fw:400;--fw-md:600;--fw-bold:800;--sp-xs:4px;--sp-sm:8px;--sp:12px;--sp-md:16px;--sp-lg:24px;
  --glow-purple:0 0 0 4px var(--purple-bg);--shadow-sheet:0 -8px 32px rgba(0,0,0,.5);
  --grad-purple:linear-gradient(135deg,#7c6ef7,#5b4bc4);--grad-progress:linear-gradient(90deg,var(--green),var(--purple));
  --grad-gold:linear-gradient(135deg,#f5c451,#e0a020);--dur-fast:.12s;--dur:.15s;--ease:cubic-bezier(.4,0,.2,1)
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.fdb{background:linear-gradient(135deg,rgba(124,110,247,.18),rgba(90,216,166,.10));border:1px solid rgba(124,110,247,.35);border-radius:var(--r);padding:18px 16px;margin-bottom:14px}
.fdb-title{font-size:var(--fs-md);font-weight:700;color:var(--text);margin-bottom:6px}
.fdb-text{font-size:var(--fs);line-height:1.5;color:var(--text2);margin-bottom:14px}
.fdb-btn{display:block;width:100%;background:var(--purple);color:#fff;border:none;border-radius:var(--r);padding:13px;font-size:var(--fs);font-weight:600;cursor:pointer;text-align:center}
.fdb-btn:active{opacity:.85}
.next-topic-card{display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--r-lg,14px);background:linear-gradient(135deg,rgba(124,110,247,.16),rgba(124,110,247,.06));border:1px solid rgba(124,110,247,.3);cursor:pointer;transition:transform .12s;margin-bottom:14px}
.next-topic-card:active{transform:scale(.985)}
.next-topic-icon{font-size:28px;flex-shrink:0}
.next-topic-body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.next-topic-eyebrow{font-size:var(--fs-xs);font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.06em}
.next-topic-title{font-size:var(--fs,15px);font-weight:650;color:var(--text)}
.next-topic-sub{font-size:var(--fs-sm,13px);color:var(--text2,#8b8b93);line-height:1.4}
.next-topic-cta{flex-shrink:0;padding:8px 15px;border-radius:999px;background:var(--purple,#7c6ef7);color:#fff;font-size:var(--fs-sm,13px);font-weight:600}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;padding-bottom:48px}

.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:.5px solid var(--line);padding:18px 16px 14px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hdr-name{font-size:var(--fs-md);font-weight:700;letter-spacing:-.3px}
.hdr-level{background:var(--purple);color:#fff;font-size:var(--fs-xs);font-weight:700;padding:3px 11px;border-radius:var(--r-lg);letter-spacing:.5px}
.overall-track{height:6px;background:var(--bg-card2);border-radius:var(--r);overflow:hidden}
.overall-fill{height:100%;background:var(--grad-progress);border-radius:var(--r);transition:width .5s}
.overall-meta{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--text2);margin-top:6px}

.journey{padding:14px 16px 4px;background:var(--bg)}
.journey-label{display:flex;justify-content:space-between;margin-bottom:8px}
.journey-title{font-size:var(--fs-sm);color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.journey-pct{font-size:var(--fs-sm);color:var(--purple);font-weight:700}
.journey-track{height:8px;background:var(--bg-card2);border-radius:var(--r);position:relative;overflow:hidden}
.journey-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--green));border-radius:var(--r);position:relative;transition:width .5s}
.journey-thumb{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(124,110,247,.5)}
.journey-marks{display:flex;justify-content:space-between;margin-top:8px}
.journey-mark{font-size:var(--fs-xs);color:var(--text3);font-weight:600}
.journey-mark.done{color:var(--green)}
.journey-mark.current{color:var(--purple)}
.journey-mark.goal{color:var(--orange)}

.streak-strip{margin:10px 16px;padding:8px 12px;background:rgba(247,163,92,.1);border:1px solid rgba(247,163,92,.2);border-radius:var(--r);font-size:var(--fs);color:var(--orange);text-align:center}

.tabs{display:flex;gap:6px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* ── Уніфікована стрілка горизонтального скролу (єдина для всіх мініапів) ── */
.scroll-hint{position:absolute;top:14px;bottom:0;right:0;display:flex;align-items:center;cursor:pointer;background:linear-gradient(to right,transparent,var(--bg) 45%);padding:0 0 0 18px;border:0;transition:opacity .2s;}
.scroll-hint span{width:26px;height:26px;border-radius:50%;background:var(--bg-card2);border:.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-md);font-weight:700;color:var(--purple);box-shadow:0 1px 4px rgba(0,0,0,.15);line-height:1;}
.scroll-hint.hidden{opacity:0;pointer-events:none;}
.tab{flex-shrink:0;padding:6px 12px;background:var(--bg-card);color:var(--text2);font-size:var(--fs-sm);font-weight:600;border-radius:var(--r-lg);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.tab.done{color:var(--green)}
.tab.locked,.tab:disabled{opacity:.4;cursor:not-allowed}

.section{padding:14px 16px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg-card);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--line)}
.stat-v{font-size:var(--fs-md);font-weight:700;letter-spacing:-.3px}
.stat-v.p{color:var(--purple)}
.stat-v.g{color:var(--green)}
.stat-v.o{color:var(--orange)}
.stat-l{font-size:var(--fs-xs);color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

.lvl-progress{background:var(--bg-card);border-radius:var(--r);padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.lvl-progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lvl-progress-name{font-size:var(--fs);font-weight:600}
.lvl-progress-pct{font-size:var(--fs);font-weight:700;color:var(--purple)}
.lvl-track{height:6px;background:var(--bg-card2);border-radius:var(--r);overflow:hidden}
.lvl-fill{height:100%;background:var(--grad-progress);transition:width .5s}
.lvl-hint{font-size:var(--fs-sm);color:var(--text2);margin-top:8px}

.topics-title{font-size:var(--fs-sm);color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 10px}

/* ── Topic card with colored bar ── */
.topic{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg-card);border-radius:var(--r);margin-bottom:8px;border:1px solid var(--line);cursor:pointer;transition:all .15s;width:100%;text-align:left}
.topic:active{transform:scale(.98)}
.topic-num{font-size:var(--fs);color:var(--text3);font-weight:600;width:18px;flex-shrink:0;text-align:center}
.topic-body{flex:1;min-width:0}
.topic-name{font-size:var(--fs);font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.topic-bar-row{display:flex;align-items:center;gap:8px}
.topic-bar-track{flex:1;height:5px;background:var(--bg-card2);border-radius:var(--r-sm);overflow:hidden}
.topic-bar-fill{height:100%;border-radius:var(--r-sm);transition:width .4s}
.topic-bar-fill.green{background:var(--green)}
.topic-bar-fill.yellow{background:var(--yellow)}
.topic-bar-fill.red{background:var(--red)}
.topic-bar-fill.gray{background:var(--text3)}
.topic-pct{font-size:var(--fs-xs);font-weight:700;width:34px;text-align:right;flex-shrink:0}
.topic-pct.green{color:var(--green)}
.topic-pct.yellow{color:var(--yellow)}
.topic-pct.red{color:var(--red)}
.topic-pct.gray{color:var(--text3)}
.topic-arr{font-size:var(--fs);color:var(--text3);flex-shrink:0}
.topic-warn{font-size:var(--fs-xs);color:var(--red);margin-left:6px}

/* ── Topic detail modal ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end}
.modal.active{display:flex}
.modal-content{background:var(--bg);width:100%;max-height:92vh;border-top-left-radius:20px;border-top-right-radius:20px;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hdr{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-shrink:0}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--fs-xl);color:var(--text2);border:0;background:transparent}
.modal-title{flex:1;font-size:var(--fs-md);font-weight:600}
.modal-body{flex:1;overflow-y:auto;padding:16px;scrollbar-width:none}
.modal-body::-webkit-scrollbar{display:none}

.detail-progress{background:var(--bg-card);border-radius:var(--r);padding:14px;margin-bottom:16px;border:1px solid var(--line)}
.detail-progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.detail-progress-label{font-size:var(--fs-sm);color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.detail-progress-pct{font-size:var(--fs-lg);font-weight:700}
.detail-progress-pct.green{color:var(--green)}
.detail-progress-pct.yellow{color:var(--yellow)}
.detail-progress-pct.red{color:var(--red)}
.detail-progress-pct.gray{color:var(--text3)}
.detail-bar-track{height:8px;background:var(--bg-card2);border-radius:var(--r);overflow:hidden}
.detail-bar-fill{height:100%;border-radius:var(--r)}

.workflow{margin-bottom:20px}
.workflow-title{font-size:var(--fs);font-weight:700;color:var(--text);margin-bottom:4px}
.workflow-hint{font-size:var(--fs-sm);color:var(--text2);margin-bottom:12px;line-height:1.5}
.step{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg-card);border-radius:var(--r);margin-bottom:8px;border:1px solid var(--line);transition:all .15s;cursor:pointer;width:100%;text-align:left}
.step:active{transform:scale(.98)}
.step.done{border-color:rgba(90,216,166,.3)}
.step.next{border-color:var(--purple);background:rgba(124,110,247,.08);box-shadow:0 0 0 1px var(--purple)}
.step.locked,.step:disabled{opacity:.5;cursor:not-allowed}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--bg-card2);display:flex;align-items:center;justify-content:center;font-size:var(--fs);font-weight:700;color:var(--text2);flex-shrink:0}
.step.done .step-num{background:var(--green);color:var(--bg)}
.step.next .step-num{background:var(--purple);color:#fff}
.step-content{flex:1;min-width:0}
.step-title{font-size:var(--fs);font-weight:600;color:var(--text)}
.step-desc{font-size:var(--fs-xs);color:var(--text2);margin-top:2px}
.step-arr{font-size:var(--fs-md);color:var(--text3)}
.step.done .step-arr{color:var(--green)}
.step.next .step-arr{color:var(--purple)}

.errors-section{background:var(--bg-card);border:1px solid rgba(247,110,110,.2);border-radius:var(--r);padding:14px;margin-bottom:16px}

/* ── Exercises panel (крок 3) ── */
.exercises-panel{display:none;margin-top:12px}
.exercises-panel.show{display:block}
.ex-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ex-title{font-size:var(--fs);font-weight:700;color:var(--text)}
.ex-counter{font-size:var(--fs-sm);color:var(--text2);background:var(--bg-card2);padding:3px 10px;border-radius:var(--r-lg)}
.ex-progress{height:4px;background:var(--bg-card2);border-radius:var(--r-sm);overflow:hidden;margin-bottom:14px}
.ex-progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--green));border-radius:var(--r-sm);transition:width .4s}
.ex-sentence{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;font-size:var(--fs-md);font-weight:500;color:var(--text);line-height:1.5;text-align:center;min-height:72px;display:flex;align-items:center;justify-content:center}
.ex-actions{display:flex;gap:10px;margin-bottom:14px;justify-content:center}
.ex-btn{padding:10px 18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg-card);
  font-size:var(--fs);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text);transition:all .15s}
.ex-btn:active{transform:scale(.95)}
.ex-btn.recording{background:rgba(247,110,110,.15);border-color:var(--red);color:var(--red);animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ex-btn.spoken{background:rgba(90,216,166,.1);border-color:var(--green);color:var(--green)}
.ex-next{width:100%;padding:13px;border-radius:var(--r);background:var(--purple);border:none;
  color:#fff;font-size:var(--fs);font-weight:700;cursor:pointer;transition:opacity .15s}
.ex-next:disabled{opacity:.4}
.ex-done-banner{background:rgba(90,216,166,.1);border:1px solid rgba(90,216,166,.3);border-radius:var(--r);
  padding:16px;text-align:center}
.ex-done-title{font-size:var(--fs-md);font-weight:700;color:var(--green);margin-bottom:4px}
.ex-done-sub{font-size:var(--fs);color:var(--text2)}
.errors-title{font-size:var(--fs);font-weight:700;color:var(--red);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.error-item{padding:10px;background:var(--bg);border-radius:var(--r-sm);margin-bottom:6px;border:1px solid var(--line)}
.error-wrong{font-size:var(--fs);color:var(--red);text-decoration:line-through;margin-bottom:4px}
.error-right{font-size:var(--fs);color:var(--green);font-weight:600;margin-bottom:6px}
.error-expl{font-size:var(--fs-xs);color:var(--text2);line-height:1.5}
.error-date{font-size:var(--fs-xs);color:var(--text3);margin-top:4px}

.close-btn{display:block;margin:24px auto 0;background:transparent;border:1px solid var(--line);color:var(--text2);padding:10px 24px;border-radius:var(--r-lg);font-size:var(--fs);cursor:pointer}
.diag-btn{display:block;width:calc(100% - 32px);margin:16px auto 0;background:var(--grad-purple);border:none;color:#fff;padding:14px;border-radius:var(--r);font-size:var(--fs);font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(124,110,247,.28)}
.next-topic-card{width:100%;text-align:left}
.tab,.topic,.step,.next-topic-card,.scroll-hint,.modal-close{font-family:inherit;appearance:none}
.tab:focus-visible,.topic:focus-visible,.step:focus-visible,.next-topic-card:focus-visible,
.scroll-hint:focus-visible,.modal-close:focus-visible,.diag-btn:focus-visible,.close-btn:focus-visible,
.fdb-btn:focus-visible,.ex-btn:focus-visible,.ex-next:focus-visible{outline:3px solid var(--purple-text);outline-offset:3px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}</style>
  <link rel="stylesheet" href="tokens.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakChain · Мій шлях</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="toast_rewards.js"></script>

</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-name" id="hdr-name">Студент</div>
    <div class="hdr-level" id="hdr-level">—</div>
  </div>
  <div class="overall-track" id="overall-progress" role="progressbar" aria-label="Загальний прогрес тем" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="overall-fill" id="overall-fill" style="width:0%"></div>
  </div>
  <div class="overall-meta">
    <span id="overall-left">Загальний прогрес</span>
    <span id="overall-right">0%</span>
  </div>
</div>

<div class="journey">
  <div class="journey-label">
    <span class="journey-title">Шлях A1 → C2</span>
    <span class="journey-pct" id="journey-pct">0%</span>
  </div>
  <div class="journey-track" id="journey-progress" role="progressbar" aria-label="Прогрес шляху A1 до C2" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="journey-fill" id="journey-fill" style="width:0%">
      <div class="journey-thumb"></div>
    </div>
  </div>
  <div class="journey-marks" id="journey-marks"></div>
</div>

<div class="streak-strip" id="streak-strip" style="display:none">
  🔥 Стрік: <span id="streak-val">0</span> днів поспіль &nbsp;·&nbsp; Рекорд: <span id="streak-best">0</span>
</div>

<div style="position:relative;">
  <div class="tabs" id="tabs" role="tablist" aria-label="Рівні англійської"></div>
  <button class="scroll-hint" id="tabs-scroll-hint" type="button" aria-label="Показати наступні рівні"><span aria-hidden="true">›</span></button>
</div>

<div class="section">
  <div class="sr-only" id="progress-status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="first-day-banner"></div>
  <div class="stats-row" id="stats-row"></div>
  <div id="lvl-progress"></div>
  <div id="vocab-progress"></div>
  <div id="next-topic-card"></div>
  <div class="topics-title">Усі теми рівня</div>
  <div id="topics-list"></div>
</div>

<button class="diag-btn" id="diagnostic-btn" type="button">🎯 Пройти діагностику знову</button>
<!-- 🔴 БУЛО: onclick="Telegram.WebApp.close()" — ВИМИКАЛО УВЕСЬ ДОДАТОК.
     Людина дивилась свій прогрес, тисне «Закрити» (маючи на увазі «закрити
     цей екран») — і додаток гасне повністю. Треба заходити наново.
     Тепер: в оболонці go('s-home') → назад на головну, додаток живий.
     Standalone (без оболонки) — стара поведінка. -->
<button class="close-btn" id="progress-close-btn" type="button">Закрити</button>

<!-- TOPIC DETAIL MODAL -->
<div class="modal" id="topic-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal-content" tabindex="-1">
    <div class="modal-hdr">
      <button class="modal-close" id="modal-close-btn" type="button" aria-label="Закрити тему">×</button>
      <div class="modal-title" id="modal-title">Тема</div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<script>
const DEFAULT_GRAMMAR = {
  A1: ["The ABC, spelling","The Numbers","a / an","Countable nouns with a/an and some","Present Simple","Present Continuous","Non-Continuous Verbs (stative)","Imperative Mood","Possessive Case ('s / s')","In, on, at — time","Comparative and Superlative Degrees","Zero Conditional","Modal Verbs: basic (can/must/should)","Going to (future plans)","Question Tags"],
  A2: ["Past Simple","Future Simple (will)","The (definite article)","Uncountable nouns","Few, little, a few, a little, much, many","Adverbs","As … as / Than","Used to","First Conditional","Gerund + V (basic)","Infinitive + V (basic)","Modal Verbs: extended (might/may/have to/could)"],

const DEFAULT_LEVEL_NAMES = {A1:"Beginner A1",A2:"Elementary A2",B1:"Intermediate B1",B2:"Upper-Intermediate B2",C1:"Advanced C1",C2:"Proficiency C2"};
const DEFAULT_LEVELS = ["A1","A2","B1","B2","C1","C2"];

let D = {};
let activeLevel = "A1";

const tg        = window.Telegram?.WebApp;
const UID       = tg?.initDataUnsafe?.user?.id || 0;

const API       = (window.SC_BOT_API || 'https://speakchain-bot-production.up.railway.app');

// ── Уніфікована відправка дії в бот через HTTP (sendData як фолбек) ──
async function maAction(action, extra){
  const body = Object.assign({
    action: action,
    uid: UID || D.uid || 0,
    init_data: INIT_DATA || '',
  }, extra || {});
  let ok=false;
  try {
    const res = await fetch(API + '/miniapp_action', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    ok = res.ok;
  } catch(e){ ok=false; }
  if(!ok && tg && typeof tg.sendData==='function'){ try{ tg.sendData(JSON.stringify(body)); }catch(e){} }
  try{ if(window.shellRoute && window.shellRoute(action)) return ok; }catch(e){}
  return ok;
}

function backOrClose(){

}

// ── Google Noto Emoji helper ──
const SAFE_COLORS = new Set(["green", "yellow", "red", "gray"]);
let modalOpener = null;

function safeText(value, maxLength=500){
  return String(value ?? "").replace(/[\u0000-\u001f\u007f]/g, " ").slice(0, maxLength);
}

function clampNumber(value, min=0, max=100){
  const number = Number(value);
  if(!Number.isFinite(number)) return min;
  return Math.min(max, Math.max(min, number));
}

function make(tag, className="", text=""){
  const element = document.createElement(tag);
  if(className) element.className = className;
  if(text !== "") element.textContent = safeText(text);
  return element;
}

function makeButton(className, label){
  const button = make("button", className);
  button.type = "button";
  if(label) button.setAttribute("aria-label", label);
  return button;
}

function setProgress(element, value, valueText=""){
  const percent = Math.round(clampNumber(value));
  element.setAttribute("aria-valuenow", String(percent));
  element.setAttribute("aria-valuetext", valueText || `${percent}%`);
  return percent;
}

function masteryColor(mastery, candidate){
  if(SAFE_COLORS.has(candidate)) return candidate;
  return mastery >= 80 ? "green" : mastery >= 50 ? "yellow" : mastery > 0 ? "red" : "gray";
}

function normalizePayload(){
  if(!D || typeof D !== "object" || Array.isArray(D)) D = {};
  const levels = Array.isArray(D.levels)
    ? D.levels.map(level => safeText(level, 2)).filter(level => DEFAULT_LEVELS.includes(level))
    : DEFAULT_LEVELS.slice();
  D.levels = levels.length ? [...new Set(levels)] : DEFAULT_LEVELS.slice();
  const grammar = D.cefr_grammar && typeof D.cefr_grammar === "object" ? D.cefr_grammar : DEFAULT_GRAMMAR;
  D.cefr_grammar = {};
  D.levels.forEach(level => {
    const topics = Array.isArray(grammar[level]) ? grammar[level] : (DEFAULT_GRAMMAR[level] || []);
    D.cefr_grammar[level] = topics.map(topic => safeText(topic, 160)).filter(Boolean).slice(0, 100);
  });
  D.level_names = D.level_names && typeof D.level_names === "object" ? D.level_names : DEFAULT_LEVEL_NAMES;
  D.topics_data = D.topics_data && typeof D.topics_data === "object" ? D.topics_data : {};
  D.vocab_coverage = D.vocab_coverage && typeof D.vocab_coverage === "object" ? D.vocab_coverage : {};
  D.level = D.levels.includes(D.level) ? D.level : D.levels[0];
}

function emojiNode(emoji, size=18){
  const label = safeText(emoji, 12);
  const codepoints = [];
  for(const char of label){
    const point = char.codePointAt(0);
    if(point !== 0xFE0F) codepoints.push(point.toString(16));
  }
  const image = document.createElement("img");
  image.src = `https://fonts.gstatic.com/s/e/notoemoji/latest/${codepoints.join("_")}/emoji.svg`;
  image.alt = label;
  image.width = size;
  image.height = size;
  image.style.cssText = `width:${size}px;height:${size}px;vertical-align:middle;display:inline-block`;
  image.addEventListener("error", () => image.replaceWith(make("span", "", label)), {once:true});
  return image;
}

function init() {
  try { window.Telegram?.WebApp?.ready(); window.Telegram?.WebApp?.expand(); } catch(e) {}
  try {
    const raw = new URLSearchParams(window.location.search).get("d");
    if (raw) D = JSON.parse(decodeURIComponent(raw));
  } catch(e) { D = {}; }
  normalizePayload();
  activeLevel = D.level;
  render();
}

function getMastery(topicName) {
  const raw = (D.topics_data || {})[topicName];
  const mastered = Array.isArray(D.mastered) ? D.mastered : [];
  const fallbackDone = mastered.includes(topicName);
  const source = raw && typeof raw === "object" ? raw : {};
  const mastery = clampNumber(raw ? source.mastery : (fallbackDone ? 100 : 0));
  const examples = Array.isArray(source.buddy_examples) ? source.buddy_examples.slice(0, 20) : [];
  return {
    mastery,
    color: masteryColor(mastery, source.color),
    buddy_uses: Math.round(clampNumber(source.buddy_uses, 0, 1000000)),
    buddy_errors: Math.round(clampNumber(source.buddy_errors, 0, 1000000)),
    buddy_examples: examples.map(example => ({
      phrase: safeText(example?.phrase, 500), correction: safeText(example?.correction, 500),
      explanation: safeText(example?.explanation, 1000), date: safeText(example?.date, 80),
    })),
    steps_done: {
      video: Boolean(source.steps_done?.video ?? fallbackDone), table: Boolean(source.steps_done?.table),
      exercises: Boolean(source.steps_done?.exercises), buddy: Boolean(source.steps_done?.buddy),
    },
    next_step: safeText(source.next_step, 40),
  };
}

function render() {
  const levels = D.levels;
  const grammar = D.cefr_grammar;
  const allTopics = levels.flatMap(level => grammar[level] || []);
  let totalScore = 0;
  let fullyDone = 0;
  allTopics.forEach(topic => {
    const mastery = getMastery(topic).mastery;
    totalScore += mastery;
    if(mastery >= 80) fullyDone++;
  });
  const overallPct = allTopics.length ? Math.round(totalScore / allTopics.length) : 0;
  document.getElementById("hdr-name").textContent = safeText(D.name || "Студент", 80);
  document.getElementById("hdr-level").textContent = activeLevel;
  document.getElementById("overall-fill").style.width = overallPct + "%";
  document.getElementById("overall-left").textContent = `${fullyDone} з ${allTopics.length} тем`;
  document.getElementById("overall-right").textContent = overallPct + "%";
  setProgress(document.getElementById("overall-progress"), overallPct, `${fullyDone} з ${allTopics.length} тем завершено`);

  const currentIndex = Math.max(0, levels.indexOf(D.level));
  let topicsBeforeCurrent = 0;
  for(let index=0; index<currentIndex; index++) topicsBeforeCurrent += (grammar[levels[index]] || []).length;
  const currentTopics = grammar[D.level] || [];
  const currentDone = currentTopics.filter(topic => getMastery(topic).mastery >= 80).length;
  const journeyPct = allTopics.length ? Math.round((topicsBeforeCurrent + currentDone) / allTopics.length * 100) : 0;
  document.getElementById("journey-pct").textContent = journeyPct + "%";
  document.getElementById("journey-fill").style.width = journeyPct + "%";
  setProgress(document.getElementById("journey-progress"), journeyPct, `${journeyPct}% шляху A1 до C2`);

  const marks = document.getElementById("journey-marks");
  marks.replaceChildren();
  levels.forEach(level => {
    const topics = grammar[level] || [];
    const done = topics.filter(topic => getMastery(topic).mastery >= 80).length;
    const complete = done === topics.length && topics.length > 0;
    const mark = make("div", "journey-mark" + (complete ? " done" : "") + (level === D.level ? " current" : "") + (level === "C2" && !complete ? " goal" : ""));
    mark.textContent = level === "C2" && !complete ? "C2 👑" : level + (complete ? "✓" : "");
    marks.appendChild(mark);
  });

  const streak = Math.round(clampNumber(D.streak, 0, 1000000));
  const streakStrip = document.getElementById("streak-strip");
  streakStrip.style.display = streak > 0 ? "flex" : "none";
  document.getElementById("streak-val").textContent = String(streak);
  document.getElementById("streak-best").textContent = String(Math.round(clampNumber(D.best_streak, 0, 1000000)));

  const tabs = document.getElementById("tabs");
  tabs.replaceChildren();
  levels.forEach((level, index) => {
    const topics = grammar[level] || [];
    const done = topics.filter(topic => getMastery(topic).mastery >= 80).length;
    const complete = done === topics.length && topics.length > 0;
    const locked = index > currentIndex;
    const button = makeButton("tab" + (level === activeLevel ? " active" : "") + (complete ? " done" : "") + (locked ? " locked" : ""));
    button.setAttribute("role", "tab");
    button.setAttribute("aria-selected", String(level === activeLevel));
    button.setAttribute("aria-controls", "topics-list");
    button.disabled = locked;
    button.textContent = level + (complete ? " ✓" : ` ${done}/${topics.length}`);
    button.addEventListener("click", () => {
      activeLevel = level;
      [...tabs.children].forEach(tab => {
        const selected = tab === button;
        tab.classList.toggle("active", selected);
        tab.setAttribute("aria-selected", String(selected));
      });
      renderLevel({announce:true});
    });
    tabs.appendChild(button);
  });
  tabs.onkeydown = event => {
    if(!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
    const enabled = [...tabs.querySelectorAll("button:not(:disabled)")];
    if(!enabled.length) return;
    event.preventDefault();
    const current = Math.max(0, enabled.indexOf(event.target));
    const next = event.key === "Home" ? 0 : event.key === "End" ? enabled.length - 1
      : (current + (event.key === "ArrowRight" ? 1 : -1) + enabled.length) % enabled.length;
    enabled[next].focus();
    enabled[next].click();
  };
  const tabStrip = document.getElementById("tabs");
  if(tabStrip && !tabStrip._hintWired){
    tabStrip.addEventListener("scroll", updateProgressTabsHint, {passive:true});
    tabStrip._hintWired = true;
  }
  setTimeout(updateProgressTabsHint, 80);
  renderLevel();
}

function scrollProgressTabs(){ document.getElementById("tabs")?.scrollBy({left:140, behavior:"smooth"}); }

function updateProgressTabsHint(){
  const tabs = document.getElementById("tabs");
  const hint = document.getElementById("tabs-scroll-hint");
  if(!tabs || !hint) return;
  const hidden = tabs.scrollWidth <= tabs.clientWidth + 4 || tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 4;
  hint.classList.toggle("hidden", hidden);
  hint.hidden = hidden;
}

function statNode(value, label, color){
  const stat = make("div", "stat");
  stat.append(make("div", `stat-v ${color}`, value), make("div", "stat-l", label));
  return stat;
}

function makeBar(label, value, valueText){
  const track = make("div", "lvl-track");
  track.setAttribute("role", "progressbar");
  track.setAttribute("aria-label", label);
  track.setAttribute("aria-valuemin", "0");
  track.setAttribute("aria-valuemax", "100");
  const percent = setProgress(track, value, valueText);
  const fill = make("div", "lvl-fill");
  fill.style.width = percent + "%";
  track.appendChild(fill);
  return track;
}

function renderLevel({announce=false, focusHeading=false}={}) {
  const grammar = D.cefr_grammar;
  const levelNames = D.level_names;
  const topics = grammar[activeLevel] || [];
  const total = topics.reduce((sum, topic) => sum + getMastery(topic).mastery, 0);
  const levelPct = topics.length ? Math.round(total / topics.length) : 0;
  const completed = topics.filter(topic => getMastery(topic).mastery >= 80).length;
  const scores = Array.isArray(D.scores) ? D.scores : [];
  const avgScore = scores.length ? Math.round(scores.reduce((sum, item) => sum + clampNumber(typeof item === "number" ? item : item?.score), 0) / scores.length) : 0;
  const stats = document.getElementById("stats-row");
  stats.replaceChildren(
    statNode(`${completed}/${topics.length}`, "Тем готово", "p"),
    statNode(avgScore || "—", "Середній бал", "g"),
    statNode(Math.round(clampNumber(D.done_lessons, 0, 1000000)), "Уроків", "o"),
  );

  const firstDay = document.getElementById("first-day-banner");
  firstDay.replaceChildren();
  if(!(clampNumber(D.done_lessons, 0, 1000000) > 0) && !scores.length){
    const card = make("div", "fdb");
    const name = safeText(D.name, 80).trim();
    card.append(
      make("div", "fdb-title", (name ? `Вітаю, ${name}! ` : "Вітаю! ") + "👋"),
      make("div", "fdb-text", "Це твоя карта прогресу. Після першого уроку тут зʼявляться бали, рівень і твій ланцюжок. Почнемо з першого кроку?"),
    );
    const start = makeButton("fdb-btn");
    start.textContent = "▶️ Почати перший урок";
    start.addEventListener("click", startFirstLesson);
    card.appendChild(start);
    firstDay.appendChild(card);
  }

  const levelProgress = document.getElementById("lvl-progress");
  levelProgress.replaceChildren();
  const levelCard = make("div", "lvl-progress");
  const top = make("div", "lvl-progress-top");
  const levelTitle = make("h2", "lvl-progress-name", safeText(levelNames[activeLevel] || activeLevel, 100));
  levelTitle.id = "active-level-title";
  levelTitle.tabIndex = -1;
  top.append(levelTitle, make("div", "lvl-progress-pct", `${levelPct}%`));
  levelCard.append(top, makeBar(`Прогрес рівня ${activeLevel}`, levelPct));
  levelProgress.appendChild(levelCard);

  renderVocabulary();
  renderNextTopicCard(topics);
  const list = document.getElementById("topics-list");
  list.replaceChildren();
  topics.forEach((topic, index) => {
    const data = getMastery(topic);
    const button = makeButton("topic", `Відкрити тему ${topic}`);
    const number = make("div", "topic-num", index + 1);
    const body = make("div", "topic-body");
    const name = make("div", "topic-name", topic);
    if(data.buddy_errors > 0) name.appendChild(make("span", "topic-warn", ` ⚠ ${data.buddy_errors} помилок`));
    const row = make("div", "topic-bar-row");
    const track = make("div", "topic-bar-track");
    track.setAttribute("role", "progressbar");
    track.setAttribute("aria-label", `Засвоєння теми ${topic}`);
    track.setAttribute("aria-valuemin", "0"); track.setAttribute("aria-valuemax", "100");
    setProgress(track, data.mastery);
    const fill = make("div", `topic-bar-fill ${data.color}`); fill.style.width = data.mastery + "%"; track.appendChild(fill);
    row.append(track, make("div", `topic-pct ${data.color}`, `${data.mastery}%`));
    body.append(name, row);
    button.append(number, body, make("div", "topic-arr", "›"));
    button.addEventListener("click", () => openTopic(topic, button));
    list.appendChild(button);
  });
  if(announce) document.getElementById("progress-status").textContent = `${activeLevel}: ${completed} з ${topics.length} тем завершено`;
  if(focusHeading) requestAnimationFrame(() => levelTitle.focus?.());
}

function renderVocabulary(){
  const host = document.getElementById("vocab-progress");
  host.replaceChildren();
  const coverage = (D.vocab_coverage || {})[activeLevel];
  const volume = Number((D.vocab_volume || {})[activeLevel]);
  const delta = Math.round(clampNumber((D.vocab_volume_delta || {})[activeLevel], 0, 1000000));
  if(!coverage && !Number.isFinite(volume)) return;
  const card = make("div", "lvl-progress"); card.style.marginTop = "10px";
  if(coverage && typeof coverage === "object"){
    const known = Math.round(clampNumber(coverage.known, 0, 10000000));
    const target = Math.round(clampNumber(coverage.target, 0, 10000000));
    const gap = Math.round(clampNumber(coverage.gap, 0, 10000000));
    const percent = clampNumber(coverage.pct);
    const top = make("div", "lvl-progress-top");
    top.append(make("div", "lvl-progress-name", `📖 Ключова лексика ${activeLevel} ${known}/${target} ключових слів`), make("div", "lvl-progress-pct", `${Math.round(percent)}%`));
    card.append(top, makeBar(`Ключова лексика ${activeLevel}`, percent));
    if(gap > 0){ const hint=make("div", "lvl-hint", `ще ${gap} до цілі рівня`); card.appendChild(hint); }
  }
  if(Number.isFinite(volume)){
    const row = make("div"); row.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)";
    const copy = make("div"); copy.append(make("div", "", `📚 Активний словник ${activeLevel}`), make("div", "lvl-hint", "усі слова рівня, що ти знаєш"));
    const count = make("div", "", Math.round(clampNumber(volume, 0, 10000000)).toLocaleString("uk")); count.style.textAlign = "right";
    if(delta > 0) count.appendChild(make("div", "lvl-hint", `↑ +${delta} за тиждень`));
    row.append(copy, count); card.appendChild(row);
  }
  host.appendChild(card);
}

function renderNextTopicCard(topics) {
  const host = document.getElementById("next-topic-card");
  host.replaceChildren();
  const next = topics.find(topic => getMastery(topic).mastery < 80);
  if(!next) return;
  const data = getMastery(next);
  const button = makeButton("next-topic-card", `Відкрити наступну тему ${next}`);
  button.append(
    make("span", "next-topic-icon", data.mastery > 0 ? "🎯" : "▶️"),
    (() => { const body=make("span", "next-topic-body"); body.append(make("span", "next-topic-eyebrow", data.mastery > 0 ? "Продовжити" : "Наступна тема"), make("span", "next-topic-title", next), make("span", "next-topic-sub", `${data.mastery}% готово`)); return body; })(),
    make("span", "next-topic-cta", "Відкрити"),
  );
  button.addEventListener("click", () => openTopic(next, button));
  host.appendChild(button);
}

function openTopic(topicName, opener=null) {
  const topic = safeText(topicName, 160);
  const data = getMastery(topic);
  const modal = document.getElementById("topic-modal");
  const body = document.getElementById("modal-body");
  modalOpener = opener || document.activeElement;
  document.getElementById("modal-title").textContent = topic;
  body.replaceChildren();

  const detail = make("div", "detail-progress");
  const detailRow = make("div", "detail-progress-row");
  detailRow.append(make("div", "detail-progress-label", "Прогрес теми"), make("div", `detail-progress-pct ${data.color}`, `${data.mastery}%`));
  const detailTrack = make("div", "detail-bar-track");
  detailTrack.setAttribute("role", "progressbar"); detailTrack.setAttribute("aria-label", `Прогрес теми ${topic}`);
  detailTrack.setAttribute("aria-valuemin", "0"); detailTrack.setAttribute("aria-valuemax", "100"); setProgress(detailTrack, data.mastery);
  const detailFill = make("div", "detail-bar-fill"); detailFill.style.width=data.mastery+"%"; detailFill.style.background=`var(--${data.color})`; detailTrack.appendChild(detailFill);
  detail.append(detailRow, detailTrack); body.appendChild(detail);

  const workflow = make("div", "workflow");
  workflow.append(make("div", "workflow-title", "Як вчити цю тему"), make("div", "workflow-hint", "Проходь у такому порядку — кожен крок будує наступний. Підсвічений крок наступний."));
  const steps = [
    {id:"video",icon:"📺",title:"Подивись відео урок",desc:"Почни з реального прикладу мовлення",cmd:"lesson"},
    {id:"table",icon:"📖",title:"Прочитай таблицю правил вголос",desc:"Структура і формула — щоб закріпити логіку",cmd:"topic"},
    {id:"exercises",icon:"🗣",title:"Проговори 30 речень для автоматизму",desc:"Положення, заперечення, питання",cmd:"tutor_me"},
    {id:"buddy",icon:"💬",title:"Закріпи в Speaking Buddy",desc:"Використай в живій розмові з AI",cmd:"buddy"},
  ];
  let nextFound = false;
  steps.forEach((step, index) => {
    const done = data.steps_done[step.id];
    const next = !done && !nextFound;
    if(next) nextFound = true;
    const locked = !done && !next;
    const button = makeButton("step" + (done ? " done" : next ? " next" : " locked"));
    button.disabled = locked;
    button.setAttribute("aria-label", `${step.title}${locked ? ", заблоковано" : ""}`);
    button.append(make("div", "step-num", done ? "✓" : index + 1));
    const content = make("div", "step-content");
    const title = make("div", "step-title"); title.append(emojiNode(step.icon,18), document.createTextNode(" "+step.title));
    content.append(title, make("div", "step-desc", step.desc));
    button.append(content, make("div", "step-arr", done ? "✓" : "→"));
    if(!locked) button.addEventListener("click", () => goToStep(step.cmd, topic));
    workflow.appendChild(button);
  });
  body.appendChild(workflow);

  if(data.buddy_examples.length){
    const errors = make("div", "errors-section"); errors.appendChild(make("div", "errors-title", "⚠️ Твої помилки в Speaking Buddy"));
    data.buddy_examples.forEach(example => {
      const item = make("div", "error-item");
      item.append(make("div", "error-wrong", example.phrase), make("div", "error-right", `→ ${example.correction}`));
      if(example.explanation) item.appendChild(make("div", "error-expl", `💡 ${example.explanation}`));
      if(example.date) item.appendChild(make("div", "error-date", example.date));
      errors.appendChild(item);
    });
    body.appendChild(errors);
  }
  modal.hidden = false;
  modal.classList.add("active");
  requestAnimationFrame(() => document.getElementById("modal-close-btn").focus());
}

function closeModal() {
  const modal = document.getElementById("topic-modal");
  if(modal.hidden) return;
  modal.classList.remove("active");
  modal.hidden = true;
  const opener = modalOpener;
  modalOpener = null;
  requestAnimationFrame(() => opener?.focus?.());
}

function handleModalKeydown(event){
  const modal = document.getElementById("topic-modal");
  if(event.key === "Escape") { event.preventDefault(); closeModal(); return; }
  if(event.key !== "Tab") return;
  const focusable = [...modal.querySelectorAll('button:not(:disabled),[href],input,textarea,[tabindex]:not([tabindex="-1"])')];
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if(event.shiftKey && event.target === first){ event.preventDefault(); last.focus(); }
  else if(!event.shiftKey && event.target === last){ event.preventDefault(); first.focus(); }
}

function startFirstLesson() {
  /* 🔴 БУЛО: maAction('start_lesson') → Telegram.WebApp.close().
     Людина тисне «Почати урок» — і додаток ГАСНЕ. Урок мав відкритись
     у чаті, тобто продукт вимикав сам себе в момент, коли людина
     нарешті зважилась учитися.

     ТЕПЕР: SC_flow() — міст оболонки, який відкриває ПЛЕЄР ПРЯМО ТУТ,
     без виходу в чат. Людина тиснула «Почати» — і одразу вчиться.
     Standalone (без оболонки): стара поведінка, бо плеєра там немає. */
  if (typeof window.SC_flow === 'function') {
    window.SC_flow();
    return;
  }
  maAction("start_lesson", {});
  if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
    try { Telegram.WebApp.close(); } catch(e){}
  }
}

function goToStep(cmd, topic) {
  // Крок 2 (Розділ M, об'єднання потоку) — таблиця Голіцинського
  // ПРЯМО в модалці, без переходу в чат. Раніше йшла окремим
  // повідомленням через maAction('open_topic_step') → бот →
  // Telegram-чат — розрив: людина мала перемикатись між додатками.
  if (cmd === 'topic') {
    openTopicTable(topic);
    return;
  }

  // Крок 3 — відкриваємо exercises прямо тут
  if (cmd === 'tutor_me') {
    openExercises(topic);
    return;
  }

  // Toast винагорода
  if (window.showReward) {
    const rewardMap = {
      "lesson":    "video_lesson_done",
      "table":     "table_read_aloud",
      "buddy":     "buddy_session",
    };
    const rewardKey = rewardMap[cmd];
    if (rewardKey) showReward(rewardKey, {topic: topic});
  }

  // Передаємо команду боту (HTTP; sendData як фолбек усередині maAction)
  setTimeout(() => {
    maAction("open_topic_step", { cmd: cmd, topic: topic });

    /* 🔴 БУЛО: Telegram.WebApp.close() — ДОДАТОК ГАСНЕ.
       Людина щойно побачила toast «+XP», тисне крок — і чорний екран.
       Винагорода показалась і зникла разом з усім продуктом.

       ТЕПЕР ведемо ВСЕРЕДИНІ додатка, кожен крок — куди треба:
         buddy  → s-buddy  (Chainy тут же, це мініап оболонки)
         lesson → SC_flow() (плеєр відкривається прямо тут)
         решта  → s-home   (головна, з ланцюжком і прогресом)
       Бот однаково отримав команду через maAction вище — просто
       людина більше не мусить виходити, щоб це побачити. */
    if (cmd === 'buddy' && typeof window.go === 'function') {
      window.go('s-buddy');
      return;
    }
    if (cmd === 'lesson' && typeof window.SC_flow === 'function') {
      window.SC_flow();
      return;
    }
    backOrClose();          // в оболонці → s-home; standalone → як було
  }, 600);
}

let exSentences   = [];
let exIdx         = 0;

// Розділ M (24.07, об'єднання потоку): таблиця Голіцинського прямо в
// модалці — той самий вміст, що раніше йшов окремим повідомленням у

// з мініапу і без переходу в Telegram-чат.
async function openTopicTable(topic) {
  let panel = document.getElementById("topic-table-panel");
  if(!panel){
    panel = make("div", "exercises-panel show");
    panel.id = "topic-table-panel";
    document.getElementById("modal-body").appendChild(panel);
  }
  panel.classList.add("show");
  panel.replaceChildren(make("div", "ex-sentence", "Завантажую таблицю..."));
  document.getElementById("modal-body").scrollTo({top:99999, behavior:"smooth"});

  let data = null;
  try{
    const response = await fetch(API + "/topic_table", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({uid:UID, init_data:INIT_DATA, topic:safeText(topic,160)}),
    });
    data = await response.json();
  }catch(e){ data = null; }

  panel.replaceChildren();
  if(!data || !data.found){
    const banner = make("div", "ex-done-banner");
    banner.append(make("div", "ex-done-title", `⚠️ Таблиця для «${safeText(topic,160)}» поки недоступна окремо`), make("div", "ex-done-sub", "Спробуй відео цієї теми 🎬"));
    panel.appendChild(banner);
    return;
  }

  const header = make("div", "ex-header");
  header.appendChild(make("div", "ex-title", `📖 ${safeText(topic,160)}`));
  panel.appendChild(header);
  if(data.ua) panel.appendChild(make("div", "lvl-hint", safeText(data.ua,1000)));
  if(Array.isArray(data.signals) && data.signals.length){
    const signals = data.signals.slice(0,8).map(signal => safeText(signal,120)).filter(Boolean);
    if(signals.length) panel.appendChild(make("div", "lvl-hint", `🔑 ${signals.join(" · ")}`));
  }
  const rows = make("div"); rows.style.marginTop = "14px";
  (Array.isArray(data.table) ? data.table.slice(0,100) : []).forEach(row => {
    const item = make("div", "ex-sentence");
    item.style.cssText = "text-align:left;min-height:0;padding:12px 16px;margin-bottom:8px;font-size:var(--fs);display:block";
    const icon = make("span", "", safeText(row?.[0],20)); icon.style.marginRight="8px";
    item.append(icon, make("code", "", safeText(row?.[1],1000)));
    if(row?.[2]){ const translation=make("div", "", safeText(row[2],1000)); translation.style.cssText="color:var(--text2);font-size:var(--fs-sm);margin-top:4px"; item.appendChild(translation); }
    rows.appendChild(item);
  });
  panel.appendChild(rows);
  if(data.formula){
    const formula = make("div", "ex-sentence", `📐 ${safeText(data.formula,3000)}`);
    formula.style.cssText = "font-family:monospace;background:var(--bg-card2);white-space:pre-line";
    panel.appendChild(formula);
  }
  const next = makeButton("ex-next"); next.style.marginTop="10px"; next.textContent="Далі → 30 речень";
  next.addEventListener("click", () => openExercises(safeText(topic,160)));
  panel.appendChild(next);
  if(window.showReward) showReward("table_read_aloud", {topic:safeText(topic,160)});
}

async function openExercises(topic) {
  exTopic = safeText(topic,160);
  exIdx = 0;
  exSpoken = 0;
  let panel = document.getElementById("exercises-panel");
  if(!panel){
    panel = make("div", "exercises-panel show"); panel.id="exercises-panel";
    document.getElementById("modal-body").appendChild(panel);
  }
  panel.classList.add("show");
  panel.replaceChildren(make("div", "ex-sentence", "Генерую речення..."));
  document.getElementById("modal-body").scrollTo({top:99999, behavior:"smooth"});
  try{
    const response = await fetch(API + "/exercises_data", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({uid:UID, init_data:INIT_DATA, topic:exTopic, level:D.level || "B1"}),
    });
    const data = await response.json();
    exSentences = Array.isArray(data.sentences)
      ? data.sentences.map(sentence => safeText(sentence,1000)).filter(Boolean).slice(0,30)
      : [];
  }catch(e){ exSentences=[]; }

  renderExercise();
}

function renderExercise() {
  const panel = document.getElementById("exercises-panel");
  if(!panel) return;
  panel.replaceChildren();
  if(exIdx >= exSentences.length){
    if(window.showReward) showReward("sentences_30_done", {topic:exTopic});
    try{
      fetch(API + "/session_activity", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({uid:UID, init_data:INIT_DATA, activity:"exercises_done", topic:exTopic, spoken_count:exSpoken}),
      });
    }catch(e){}
    const banner = make("div", "ex-done-banner");
    banner.append(make("div", "ex-done-title", "🎉 30 речень завершено!"), make("div", "ex-done-sub", `Проговорено: ${exSpoken} з ${exSentences.length}. Тема зараховується ✅`));
    panel.appendChild(banner);
    document.getElementById("progress-status").textContent = `Вправи завершено: ${exSpoken} з ${exSentences.length} речень проговорено`;
    return;
  }

  const sentence = safeText(exSentences[exIdx],1000);
  const percent = exSentences.length ? Math.round(exIdx / exSentences.length * 100) : 0;
  const header = make("div", "ex-header");
  header.append(make("div", "ex-title", `🗣 Речення ${exIdx+1}/${exSentences.length}`), make("div", "ex-counter", `Проговорено: ${exSpoken}`));
  const progress = make("div", "ex-progress");
  progress.setAttribute("role","progressbar"); progress.setAttribute("aria-label","Прогрес вправ");
  progress.setAttribute("aria-valuemin","0"); progress.setAttribute("aria-valuemax",String(exSentences.length));
  progress.setAttribute("aria-valuenow",String(exIdx)); progress.setAttribute("aria-valuetext",`Речення ${exIdx+1} з ${exSentences.length}`);
  const fill=make("div","ex-progress-fill"); fill.style.width=percent+"%"; progress.appendChild(fill);
  const sentenceNode=make("div","ex-sentence",sentence); sentenceNode.id="ex-sentence";
  const actions=make("div","ex-actions");
  const listen=makeButton("ex-btn"); listen.id="ex-tts-btn"; listen.textContent="🔊 Послухати"; listen.addEventListener("click",exSpeak);
  const record=makeButton("ex-btn"); record.id="ex-mic-btn"; record.textContent="🎤 Проговорити"; record.addEventListener("click",exToggleRecord);
  actions.append(listen,record);
  const next=makeButton("ex-next"); next.id="ex-next-btn"; next.textContent="Далі →"; next.addEventListener("click",exNext);
  panel.append(header,progress,sentenceNode,actions,next);
  setTimeout(() => exSpeak(),400);
}

function exSpeak() {
  const sentence = exSentences[exIdx];
  if (!sentence) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(sentence);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.startsWith('en') && !v.localService)
         || voices.find(v => v.lang.startsWith('en'));
  if (v) utt.voice = v;
  speechSynthesis.speak(utt);
}

async function exToggleRecord() {
  if (exIsRecording) {
    exStopRecord();
    return;
  }

  const btn = document.getElementById('ex-mic-btn');

  // Спробуємо Speech Recognition
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    exRecognition = new SR();
    exRecognition.lang = 'en-US';
    exRecognition.interimResults = false;
    exRecognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      // Показуємо що сказав юзер
      const sentEl = document.getElementById('ex-sentence');
      if (sentEl) {
        sentEl.replaceChildren();
        const heardLabel = make("span", "", "Ти сказав:");
        heardLabel.style.cssText = "color:var(--text2);font-size:var(--fs-sm)";
        const heard = make("span", "", safeText(transcript,1000));
        heard.style.color = "var(--green)";
        const original = make("span", "", safeText(exSentences[exIdx],1000));
        original.style.cssText = "color:var(--text2);font-size:var(--fs-sm);margin-top:4px;display:block";
        sentEl.append(heardLabel, document.createElement("br"), heard, document.createElement("br"), original);
      }
      exMarkSpoken();
      exStopRecord();
    };
    exRecognition.onerror = () => {
      // Fallback на запис без розпізнавання
      exRecognition = null;
      exStartMediaRecord(btn);
    };
    exRecognition.onend = () => exStopRecord();
    try {
      window.speechSynthesis.cancel();
      exRecognition.start();
      exIsRecording = true;
      if (btn) { btn.classList.add('recording'); btn.textContent = '⏹ Зупинити'; }
      return;
    } catch(e) {
      exRecognition = null;
    }
  }

  // Fallback — просто запис
  exStartMediaRecord(btn);
}

async function exStartMediaRecord(btn) {
  try {
    exMediaStream = await navigator.mediaDevices.getUserMedia({audio: true});
    exIsRecording = true;
    if (btn) { btn.classList.add('recording'); btn.textContent = '⏹ Зупинити'; }
    window.speechSynthesis.cancel();

    const chunks = [];
    const recorder = new MediaRecorder(exMediaStream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, {type: 'audio/webm'});
      const url  = URL.createObjectURL(blob);
      // Спочатку TTS оригінал, потім запис юзера
      exSpeak();
      setTimeout(() => new Audio(url).play(), 2000);
      exMarkSpoken();
    };
    recorder.start();
    exIsRecording = true;

    // Автозупинка 8 сек
    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
      exStopRecord();
    }, 8000);
  } catch(e) {
    exIsRecording = false;
  }
}

function exStopRecord() {
  exIsRecording = false;
  if (exRecognition) {
    try { exRecognition.stop(); } catch(e) {}
    exRecognition = null;
  }
  if (exMediaStream) {
    exMediaStream.getTracks().forEach(t => t.stop());
    exMediaStream = null;
  }
  const btn = document.getElementById('ex-mic-btn');
  if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤 Проговорити'; }
}

function exMarkSpoken() {
  exSpoken++;
  const btn = document.getElementById('ex-mic-btn');
  if (btn) { btn.classList.add('spoken'); btn.textContent = '✓ Проговорив'; }
  const counter = document.querySelector('.ex-counter');
  if (counter) counter.textContent = `Проговорено: ${exSpoken}`;
  // #1: кожна проговорена фраза = ланка + XP одразу (мотивація по ходу)
  try {
    fetch(API + '/phrase_spoken', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        uid: UID, init_data: INIT_DATA,
        topic: exTopic, source: 'progress_exercises',
      })
    }).then(r => r.json()).then(d => {
      if (d && d.xp_added && window.showReward) {
        showReward('phrase_spoken', { xp: d.xp_added });
      }
    }).catch(() => {});
  } catch(e) {}
}

function exNext() {
  exStopRecord();
  window.speechSynthesis.cancel();
  exIdx++;
  renderExercise();
  // Скролимо до exercises panel
  const panel = document.getElementById('exercises-panel');
  if (panel) panel.scrollIntoView({behavior: 'smooth', block: 'start'});
}

init();

// ── Картка після сесії ──
let beaconSent = false;
function endSession() {
  if (beaconSent || exSpoken < 1) return;
  beaconSent = true;
  try {
    const blob = new Blob([JSON.stringify({
      uid: UID, init_data: INIT_DATA, source: 'progress', count: exSpoken,
    })], { type: 'application/json' });
    navigator.sendBeacon(`${API}/miniapp_session_end`, blob);
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') endSession();
});
window.addEventListener('pagehide', endSession);
