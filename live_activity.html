<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d14"><title>SpeakChain · Live</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0d0d14;--card:#191923;--line:#303042;--text:#f3f3fb;--muted:#9999b3;--accent:#7c6ef7;--ok:#56d8a4;--bad:#f47777}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 100px}.state{text-align:center;padding:44px 8px}.icon{font-size:54px}h1{font-size:26px}p{color:var(--muted)}.count{font-size:34px;font-weight:800;color:var(--accent);margin:22px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.prompt{font-size:20px;font-weight:750;margin-bottom:14px}.option,button.primary{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;margin:5px 0;background:#222230;color:var(--text);font:inherit;text-align:left}.option.on{border-color:var(--accent);background:#29224c}button.primary{background:var(--accent);border:0;text-align:center;font-weight:750}.nav{display:flex;gap:10px}.nav button:first-child{width:auto;background:var(--card)}textarea{width:100%;min-height:110px;background:#222230;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px;font:inherit}.bar{height:6px;background:var(--card);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.ok{color:var(--ok)}.bad{color:var(--bad)}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <section id="loading" class="state"><div class="icon">🔗</div><h1>Готуємо Live</h1><p>Перевіряємо запрошення…</p></section>
  <section id="waiting" class="state" hidden><div class="icon">🎙</div><h1 id="wait-title"></h1><p id="wait-time"></p><div class="count" id="countdown"></div><p class="ok">Ви приєднані. Залиште цю кнопку — активність відкриється автоматично.</p></section>
  <section id="runner" hidden><h1 id="title"></h1><div class="bar"><i id="bar"></i></div><p id="step-label"></p><div id="step"></div><div class="nav"><button class="primary" id="back">Назад</button><button class="primary" id="next">Далі</button></div></section>
  <section id="complete" class="state" hidden><div class="icon">✅</div><h1>Результат зараховано</h1><p class="ok">Він уже у Вашому приватному кабінеті.</p><div class="card" id="result"></div></section>
  <section id="failure" class="state" hidden><div class="icon">⚠️</div><h1>Не вдалося відкрити</h1><p class="bad" id="error"></p><button class="primary" onclick="location.reload()">Спробувати ще раз</button></section>
</main><script>
(()=>{'use strict';
 const TG=window.Telegram?.WebApp;try{TG?.ready();TG?.expand()}catch(e){}
 const q=new URLSearchParams(location.search),code=(q.get('session')||'').toUpperCase(),api=(q.get('api')||'https://robust-grace-production-dee4.up.railway.app').replace(/\/+$/,'');
 const $=id=>document.getElementById(id), ids=['loading','waiting','runner','complete','failure']; let session,activity,index=0,answers={},started=false;
 const show=id=>ids.forEach(x=>$(x).hidden=x!==id); const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':TG?.initData||''});
 const uuid=()=>crypto.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)});
 const fail=m=>{$('error').textContent=m;show('failure')};
 async function getSession(){const r=await fetch(`${api}/api/v1/live-sessions/${encodeURIComponent(code)}`),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Запрошення недоступне.');return d.session}
 async function register(){if(!TG?.initData)throw Error('Відкрийте запрошення через кнопку в Telegram-боті SpeakChain.');const r=await fetch(`${api}/api/v1/live-sessions/${code}/register`,{method:'POST',headers:headers(),body:JSON.stringify({source:'live_runner'})});if(!r.ok)throw Error('Не вдалося зареєструвати участь.')}
 async function event(name){try{await fetch(`${api}/api/v1/live-sessions/${code}/events`,{method:'POST',headers:headers(),body:JSON.stringify({event:name}),keepalive:true})}catch(e){}}
 function markStarted(){if(started)return;started=true;event('started')}
 function wait(){show('waiting');$('wait-title').textContent=session.title;const at=new Date(session.scheduled_at);$('wait-time').textContent=at.toLocaleString('uk-UA',{dateStyle:'long',timeStyle:'short'});let timer;const tick=async()=>{const left=at-Date.now();if(left<=0){clearInterval(timer);try{session=await getSession();if(session.activity){activity=session.activity;show('runner');render()}else setTimeout(boot,3000)}catch(e){fail(e.message)}return}const s=Math.ceil(left/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;$('countdown').textContent=(d?d+' д ':'')+[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')};tick();timer=setInterval(tick,1000)}
 function present(step){const v=answers[step.id];return step.type==='information'||(v!==undefined&&v!==''&&(!Array.isArray(v)||v.length))}
 function render(){const steps=activity.spec.steps,st=steps[index];$('title').textContent=session.title;$('bar').style.width=((index+1)/steps.length*100)+'%';$('step-label').textContent=`Крок ${index+1} із ${steps.length}`;$('step').innerHTML='';const c=document.createElement('div');c.className='card';const p=document.createElement('div');p.className='prompt';p.textContent=st.prompt||st.title||activity.title;c.append(p);if(st.type==='information'){const b=document.createElement('p');b.textContent=st.body||'';c.append(b)}else if(st.type==='single_choice'||st.type==='multi_choice'){st.options.forEach(o=>{const b=document.createElement('button');b.className='option';const on=st.type==='single_choice'?answers[st.id]===o.id:(answers[st.id]||[]).includes(o.id);if(on)b.classList.add('on');b.textContent=o.label;b.onclick=()=>{if(st.type==='single_choice')answers[st.id]=o.id;else{const a=new Set(answers[st.id]||[]);a.has(o.id)?a.delete(o.id):a.add(o.id);answers[st.id]=[...a]}render()};c.append(b)})}else if(st.type==='scale'){const i=document.createElement('input');i.type='range';i.min=st.min;i.max=st.max;i.value=answers[st.id]??st.min;answers[st.id]=Number(i.value);const o=document.createElement('div');o.className='count';o.textContent=i.value;i.oninput=()=>{answers[st.id]=Number(i.value);o.textContent=i.value};c.append(o,i)}else{const t=document.createElement('textarea');t.maxLength=st.max_chars||300;t.value=answers[st.id]||'';t.oninput=()=>answers[st.id]=t.value;c.append(t)}$('step').append(c);$('back').disabled=index===0;$('next').disabled=st.required&&!present(st);$('next').textContent=index===steps.length-1?'Завершити':'Далі'}
 async function submit(){show('loading');try{markStarted();const r=await fetch(`${api}/api/v1/live-sessions/${code}/attempts`,{method:'POST',headers:headers(),body:JSON.stringify({attempt_id:uuid(),spec_version:activity.version,answers})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Результат не збережено.');const x=d.result||{};$('result').innerHTML=`<b>${x.outcome_label||'Виконано'}</b><br>${x.percent==null?'':x.percent+'%'}<br>${x.message||''}`;show('complete')}catch(e){event('error');fail(e.message)}}
 $('back').onclick=()=>{if(index){markStarted();index--;render()}};$('next').onclick=()=>{const st=activity.spec.steps[index];if(st.required&&!present(st))return;markStarted();if(index<activity.spec.steps.length-1){index++;render()}else submit()};
 async function boot(){if(!code)return fail('У запрошенні немає коду сесії.');try{session=await getSession();await register();event('opened');if(session.activity){activity=session.activity;show('runner');render()}else if(session.effective_status==='session_not_started')wait();else fail('Сесію завершено.')}catch(e){event('error');fail(e.message)}}boot();
})();
</script></body></html>
