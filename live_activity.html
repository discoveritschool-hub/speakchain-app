function showVideoMission(attemptId,result){videoAttemptId=attemptId;const mission=activity?.spec?.speaking_mission||{},min=Number(mission.min_video_seconds||20),max=Number(mission.max_video_seconds||60);screen.innerHTML=`<div class="topic">Фінал · вірусна англійська</div><div class="prompt">${escape(mission.prompt||'Запиши коротку відеовідповідь англійською.')}</div><div class="personal"><b>Hook:</b> ${escape(mission.hook||'Here is my answer…')}<br><b>Твої слова:</b> ${lexicon.slice(0,3).map(escape).join(' · ')}<br><b>Естафета:</b> ${escape(mission.relay_question||'What do you think?')}</div><div class="video-clock" id="videoClock">00:00</div><button class="button" id="videoRecord">📹 Почати запис</button><video class="video-preview" id="videoPreview" controls playsinline></video><div class="quality" id="videoQuality">Запиши ${min}–${max} секунд. Відео спочатку приватне.</div><div class="video-actions" id="videoActions" style="display:none"><button class="button secondary" id="videoPrivate">Зберегти приватно</button><button class="button" id="videoRelay">Передати естафету</button></div><p class="small">Публікація або надсилання іншій людині відбувається лише після твого вибору.</p>`;$('videoRecord').onclick=toggleVideoRecord;$('videoPrivate').onclick=()=>publishVideo('private');$('videoRelay').onclick=()=>publishVideo('relay')}
async function toggleVideoRecord(){if(videoRec?.state==='recording'){videoRec.stop();return}try{videoStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:{facingMode:'user'}});const mime='video/webm;codecs=vp8,opus';videoChunks=[];videoTranscript='';videoRec=new MediaRecorder(videoStream,MediaRecorder.isTypeSupported(mime)?{mimeType:mime}:undefined);videoRec.ondataavailable=e=>{if(e.data.size)videoChunks.push(e.data)};videoRec.onstop=async()=>{clearInterval(videoTimer);videoBlob=new Blob(videoChunks,{type:videoRec.mimeType||'video/webm'});videoB64=await blobData(videoBlob);stopVideoTracks();const preview=$('videoPreview');preview.src=URL.createObjectURL(videoBlob);preview.style.display='block';const mission=activity?.spec?.speaking_mission||{},min=Number(mission.min_video_seconds||20),max=Number(mission.max_video_seconds||60),valid=videoSec>=min&&videoSec<=max&&videoBlob.size<18*1024*1024;$('videoQuality').className='quality '+(valid?'good':'');$('videoQuality').textContent=valid?'Тривалість і файл перевірено ✓ Тепер обери, що зробити з відео.':videoBlob.size>=18*1024*1024?'Файл завеликий. Запиши коротше.':`Потрібно щонайменше ${min} секунд. Запиши ще раз.`;$('videoActions').style.display=valid?'grid':'none';$('videoRecord').textContent='Перезаписати'};videoRec.start(250);videoSec=0;$('videoRecord').textContent='■ Завершити запис';videoTimer=setInterval(()=>{videoSec++;if($('videoClock'))$('videoClock').textContent=fmtSec(videoSec);if(videoSec>=60&&videoRec?.state==='recording')videoRec.stop()},1000);const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(Speech){const recognition=new Speech();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=e=>{videoTranscript=Array.from(e.results).map(x=>x[0].transcript).join(' ')};try{recognition.start()}catch(e){}}}catch(e){stopVideoTracks();alert('Дозволь доступ до камери й мікрофона. Відео не публіку async function socialCall(op,extra={}){return json(BOT+'/social_api',{method:'POST',body:JSON.stringify(Object.assign(body({uid:TG?.initDataUnsafe?.user?.id||0,op}),extra))})}async function publishVideo(mode){if(!videoB64||videoSec<20)return;const buttons=[...screen.querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);try{const mission=activity?.spec?.speaking_mission||{},topic=mission.prompt||activity.title,phrase=mission.hook||'';let shareUrl='';if(mode==='relay'){const relay=await socialCall('relay_create',{topic});await json(BOT+'/miniapp_action',{method:'POST',body:JSON.stringify(body({action:'relay_room_send',room_id:relay.room_id,video_b64:videoB64.split(',').pop(),media_mime:videoBlob?.type||'video/webm'}))});shareUrl=relay.room_url||''}else await socialCall('publish',{topic,phrase,transcript:videoTranscript,visibility:'private',media_type:'video',media_b64:videoB64,media_mime:(videoBlob?.type||'video/webm').split(';')[0],duration_sec:videoSec});await json(BOT+'/miniapp_action',{method:'POST',body:JSON.stringify(body({action:'live_video_done',attempt_id:videoAttemptId,duration_seconds:videoSec,share_mode:mode,transcript:videoTranscript}))});const saved=mode==='relay'?'Естафету створено 🔗':'Відео збережено приватно ✓';screen.innerHTML=`<div class="done"><div class="topic">Результат у прогресі</div><div class="score">✓</div><h2>${saved}</h2><p>Граматика, клікабельні відповіді, підготовка й відеорезультат зафіксовані окремо.</p>${shareUrl?`<button class="button" id="shareRelay">Надіслати естафету другу</button>`:''}</div>`;if($('shareRelay'))$('shareRelay').onclick=()=>navigator.share?navigator.share({title:'SpeakChain speaking relay',text:mission.relay_question||'Продовж англійською',url:shareUrl}).catch(()=>{}):navigator.clipboard?.writeText(shareUrl)}catch(e){alert(e.message);buttons.forEach(x=>x.disabled=false)}}
function headers(){const h={'Content-Type':'application/json'};if(TG?.initData)h['X-Telegram-Init-Data']=TG.initData;const token=window.SC_PWA?.token?.();if(token)h.Authorization='Bearer '+token;return h}function body(x={}){return Object.assign({init_data:TG?.initData||''},x)}async function json(url,opts={}){const r=await fetch(url,Object.assign({},opts,{headers:Object.assign(headers(),opts.headers||{})})),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Помилка з’єднання');return d}function event(name){return json(`${api}/api/v1/live-sessions/${code}/events`,{method:'POST',body:JSON.stringify(body({event:name}))}).catch(()=>{})}function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function substitute(text){return String(text||'').replace(/\{\{lexicon_(\d+)\}\}/g,(_,n)=>lexicon[Number(n)-1]||`моя фраза №${n}`)}
let questions=[],qaOpen=false;function qaStatus(x){return x==='on_air'?'🔴 Відповідь в ефірі':x==='answered'?'✓ Відповіли':'У черзі'}function renderQuestions(){const list=$('qaList');if(!list)return;$('qaBadge').textContent=questions.filter(x=>x.status==='answered').length?`· ${questions.filter(x=>x.status==='answered').length}`:'';list.innerHTML=questions.length?questions.map(x=>`<article class="qa-item ${escape(x.status)}"><div class="qa-q">${escape(x.question)}</div>${x.answer?`<div class="qa-answer"><b>Відповідь:</b> ${escape(x.answer)}</div>`:''}<div class="qa-meta"><span>${qaStatus(x.status)}</span>${x.mine?'<span>· ваше</span>':`<button class="qa-vote" data-vote="${Number(x.id)}" ${x.voted?'disabled':''}>▲ ${Number(x.votes||0)}</button>`}</div></article>`).join(''):'<p class="small">Питань ще немає. Поставте перше — інші учні зможуть підтримати його голосом.</p>';list.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>voteQuestion(b.dataset.vote))}async function loadQuestions(){if(!code)return;try{const d=await json(`${api}/api/v1/live-sessions/${code}/questions`);questions=d.questions||[];renderQuestions()}catch(e){if(qaOpen)$('qaList').innerHTML=`<p class="small">${escape(e.message)}</p>`}}async function voteQuestion(id){try{await json(`${api}/api/v1/live-sessions/${code}/questions/${id}/vote`,{method:'POST',body:JSON.stringify(body())});await loadQuestions()}catch(e){alert(e.message)}}async function askQuestion(){const input=$('qaInput'),value=input.value.trim();if(value.length<3)return alert('Напишіть питання трохи детальніше.');$('qaSend').disabled=true;try{const d=await json(`${api}/api/v1/live-sessions/${code}/questions`,{method:'POST',body:JSON.stringify(body({question:value,context_step_id:currentId}))});input.value='';if(d.question?.instant_help)$('qaHint').innerHTML=`<div class="qa-hint"><b>Можливо, це вже допоможе:</b><br>${escape(d.question.instant_help)}<div class="small">Питання все одно залишилось у черзі ведучого.</div></div>`;await loadQuestions();try{TG?.HapticFeedback?.notificationOccurred('success')}catch(e){}}catch(e){alert(e.message)}finally{$('qaSend').disabled=false}}function toggleQuestions(open){qaOpen=open;$('qaSheet').classList.toggle('open',open);$('qaSheet').setAttribute('aria-hidden',String(!open));if(open)loadQuestions()}$('askOpen').onclick=()=>toggleQuestions(true);$('qaClose').onclick=()=>toggleQuestions(false);$('qaSheet').onclick=e=>{if(e.target===$('qaSheet'))toggleQuestions(false)};$('qaSend').onclick=askQuestion;
async function loadLexicon(){try{const d=await json(BOT+'/vocab_data',{method:'POST',body:JSON.stringify({uid:TG?.initDataUnsafe?.user?.id||0,init_data:TG?.initData||''})});const items=[...(d.due||[]),...(d.phrases||[])],seen=new Set;lexicon=items.map(x=>String(x.phrase||'').trim()).filter(x=>x&&!seen.has(x)&&seen.add(x)).slice(0,3)}catch(e){}const fallback=activity?.spec?.personalization?.fallback_lexicon||[];while(lexicon.length<3)lexicon.push(fallback[lexicon.length]||['work from home','learn English every day','meet new people'][lexicon.length])}function steps(){return activity?.spec?.steps||[]}function activeStep(){return steps().find(x=>x.id===currentId)||null}function progress(st){const list=steps(),i=Math.max(0,list.findIndex(x=>x.id===st?.id));$('bar').style.width=(st?(i+1)/list.length*100:0)+'%';$('counter').textContent=st?`${i+1}/${list.length}`:''}function renderWait(msg='Ведучий зараз відкриє наступне завдання.'){progress(null);screen.innerHTML=`<div class="wait"><div class="pulse"></div><b>${escape(msg)}</b><p class="small">Не закривайте екран — він оновиться автоматично.</p></div>`}
function render(){if(completed)return;const st=activeStep();if(!st)return renderWait();progress(st);const personal=/\{\{lexicon_/.test(JSON.stringify(st));screen.innerHTML=`<div class="topic">${escape(activity.title)}</div><div class="prompt">${escape(substitute(st.prompt||st.title||activity.title))}</div>${personal?'<div class="personal">🔒 Фраза взята з вашого особистого словника. Ведучий її не бачить.</div>':''}<div id="content"></div><div id="feedback" class="feedback"></div>`;const box=$('content');if(st.type==='information'){box.innerHTML=`<p>${escape(substitute(st.body||''))}</p><p class="small">Чекаємо, доки ведучий відкриє перше питання.</p>`;return}if(st.type==='single_choice'||st.type==='multi_choice'){(st.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=substitute(o.label);b.dataset.id=o.id;if(checks[st.id])paint(b,checks[st.id]);b.disabled=!!checks[st.id];b.onclick=()=>check(st,o.id);box.append(b)});showFeedback(st);return}box.innerHTML='<p class="small">Цей крок буде доступний у наступній версії шаблону.</p>'}function paint(btn,result){const id=btn.dataset.id,correct=(result.correct_option_ids||[]).includes(id);if(correct)btn.classList.add('correct');if(id===String(result.answer)&&!result.correct)btn.classList.add('wrong')}function showFeedback(st){const r=checks[st.id],f=$('feedback');if(!r||!f)return;f.className='feedback show '+(r.correct?'good':'bad');f.innerHTML=`<b>${r.correct?'Правильно ✓':'Спробу зафіксовано'}</b>${r.explanation?'<br>'+escape(r.explanation):''}${isLastAnswerable(st)?'<button class="button" id="finish">Завершити й записати у прогрес</button>':''}`;if($('finish'))$('finish').onclick=submit}function isLastAnswerable(st){const a=steps().filter(x=>x.type!=='information');return a[a.length-1]?.id===st.id&&a.every(x=>answers[x.id]!==undefined)}
async function check(st,answer){if(checks[st.id])return;[...screen.querySelectorAll('.option')].forEach(b=>b.disabled=true);try{event('started');const r=await json(`${api}/api/v1/live-sessions/${code}/check`,{method:'POST',body:JSON.stringify(body({step_id:st.id,answer}))});answers[st.id]=r.answer;checks[st.id]=r;try{TG?.HapticFeedback?.notificationOccurred(r.correct?'success':'error')}catch(e){}render()}catch(e){[...screen.querySelectorAll('.option')].forEach(b=>b.disabled=false);alert(e.message)}}function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}
async function submit(){
  if(submitting)return;submitting=true;const attemptId=uuid();screen.innerHTML='<div class="wait"><div class="pulse"></div><b>Записуємо результат у прогрес…</b></div>';
  try{const d=await json(`${api}/api/v1/live-sessions/${code}/attempts`,{method:'POST',body:JSON.stringify(body({attempt_id:attemptId,spec_version:activity.version,answers}))});await json(BOT+'/miniapp_action',{method:'POST',body:JSON.stringify(body({action:'live_lesson_done',attempt_id:attemptId,personal_lexicon:lexicon}))});completed=true;$('bar').style.width='100%';showVideoMission(attemptId,d.result||{})}
  catch(e){submitting=false;screen.innerHTML=`<div class="done"><h2>Не вдалося зберегти</h2><p>${escape(e.message)}</p><button class="button" id="retry">Повторити</button></div>`;$('retry').onclick=submit}
}
async function poll(){if(completed||!code)return;try{const d=await json(`${api}/api/v1/live-sessions/${code}`);session=d.session;$('lesson').textContent=session.title||'Відкритий урок';if(session.activity&&!activity){activity=session.activity;await loadLexicon();event('opened');prepDone=localStorage.getItem('sc_live_prep_'+code)==='done'||!prepSpec();prepStarted=Date.now();if(!prepDone)renderPreparation()}const next=session.control?.current_step_id||null;if(activity&&prepDone&&next!==currentId){currentId=next;render()}}catch(e){}setTimeout(poll,2000)}setInterval(()=>{if(qaOpen)loadQuestions();const clock=$('videoClock');if(!completed&&clock&&prepSpec())clock.textContent=fmtSec(prepElapsed())},1000);if(!code)renderWait('У посиланні немає коду сесії.');else{json(`${api}/api/v1/live-sessions/${code}/register`,{method:'POST',body:JSON.stringify(body({source:'telegram_live'}))}).catch(()=>{});poll()}})();
</script></body></html>
