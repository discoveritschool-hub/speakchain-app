<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpeakChain · Завдання ефіру</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="api_client.js"></script>
<style>
:root{--card:#fff;--ink:#211a35;--muted:#786e91;--purple:#7557e8;--line:#e8e1f5;--good:#168b5b;--bad:#ce405b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f8f5ff,#eef7ff);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh}.app{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom))}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand b{font-size:18px}.live{color:#bd3650;font-size:13px;font-weight:800;letter-spacing:.08em}.progress{height:7px;background:#e5def4;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7657e9,#28a7a1);transition:.35s}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:8px 2px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 15px 40px #4c347017}.topic{color:var(--purple);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.prompt{font-size:23px;line-height:1.28;font-weight:800;margin:10px 0 18px}.personal{background:#f2edff;border-radius:12px;padding:10px 12px;color:#5b42bd;font-size:13px;margin-bottom:14px}.option{width:100%;text-align:left;margin:8px 0;padding:15px 16px;border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font:600 16px system-ui;cursor:pointer;transition:.15s}.option:active{transform:scale(.99)}.option.correct{border-color:var(--good);background:#eaf8f1;color:#086b43}.option.wrong{border-color:var(--bad);background:#fff0f2;color:#a51f3a}.option:disabled{opacity:1;cursor:default}.feedback{display:none;margin-top:14px;padding:13px 14px;border-radius:14px;font-size:14px}.feedback.show{display:block}.feedback.good{background:#eaf8f1;color:#096d46}.feedback.bad{background:#fff0f2;color:#a51f3a}.wait{text-align:center;padding:52px 22px}.pulse{width:44px;height:44px;border:4px solid #d9cff8;border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}.button{border:0;border-radius:15px;background:var(--purple);color:white;padding:15px 20px;font:800 16px system-ui;width:100%;margin-top:16px;cursor:pointer}.done{text-align:center}.done .score{font-size:54px;font-weight:900;color:var(--purple);margin:8px}.small{font-size:13px;color:var(--muted)}
.ask-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#211a35;color:#fff;padding:13px 17px;font:800 14px system-ui;box-shadow:0 10px 30px #211a3550;z-index:5}.qa-sheet{position:fixed;inset:0;background:#160f2988;z-index:10;display:none;align-items:flex-end}.qa-sheet.open{display:flex}.qa-panel{width:100%;max-height:88vh;overflow:auto;background:#f9f7ff;border-radius:24px 24px 0 0;padding:20px max(16px,calc((100vw - 650px)/2));box-shadow:0 -20px 60px #0003}.qa-head{display:flex;justify-content:space-between;align-items:center}.qa-head h2{margin:0}.qa-close{border:0;background:transparent;font-size:26px}.qa-input{width:100%;min-height:82px;border:2px solid var(--line);border-radius:15px;padding:13px;font:15px system-ui;resize:vertical}.qa-send{margin:8px 0 16px}.qa-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.qa-item.on_air{border-color:#ff8ba0}.qa-q{font-weight:750}.qa-answer{margin-top:8px;padding:9px 10px;border-radius:10px;background:#eaf8f1;color:#096d46}.qa-meta{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px}.qa-vote{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;color:var(--ink)}.qa-hint{background:#f2edff;color:#5b42bd;border-radius:12px;padding:11px;margin-bottom:12px}
</style></head><body><main class="app"><div class="brand"><b>SpeakChain</b><span class="live">● LIVE</span></div><div class="progress"><i id="bar"></i></div><div class="meta"><span id="lesson">Відкритий урок</span><span id="counter"></span></div><section class="card" id="screen"><div class="wait"><div class="pulse"></div><b>Підключаємо до ефіру…</b><p class="small">Завдання з’явиться тут одночасно з екраном ведучого.</p></div></section></main><button class="ask-fab" id="askOpen">❓ Поставити питання <span id="qaBadge"></span></button><section class="qa-sheet" id="qaSheet" aria-hidden="true"><div class="qa-panel"><div class="qa-head"><div><h2>Питання потоку</h2><div class="small">Під час ефіру й після нього</div></div><button class="qa-close" id="qaClose" aria-label="Закрити">×</button></div><div id="qaHint"></div><textarea class="qa-input" id="qaInput" maxlength="500" placeholder="Що саме незрозуміло? Додайте свій приклад — так легше відповісти."></textarea><button class="button qa-send" id="qaSend">Надіслати у чергу</button><div id="qaList"><p class="small">Завантажуємо питання…</p></div></div></section>
<script>
(()=>{'use strict';const TG=window.Telegram?.WebApp||null;try{TG?.ready();TG?.expand()}catch(e){}const q=new URLSearchParams(location.search),code=(q.get('session')||'').toUpperCase(),api=(q.get('api')||'https://robust-grace-production-dee4.up.railway.app').replace(/\/$/,''),BOT='https://speakchain-bot-production.up.railway.app';const $=id=>document.getElementById(id),screen=$('screen');let session=null,activity=null,answers={},checks={},lexicon=[],currentId=null,submitting=false,completed=false;
function headers(){const h={'Content-Type':'application/json'};if(TG?.initData)h['X-Telegram-Init-Data']=TG.initData;const token=window.SC_PWA?.token?.();if(token)h.Authorization='Bearer '+token;return h}function body(x={}){return Object.assign({init_data:TG?.initData||''},x)}async function json(url,opts={}){const r=await fetch(url,Object.assign({},opts,{headers:Object.assign(headers(),opts.headers||{})})),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Помилка з’єднання');return d}function event(name){return json(`${api}/api/v1/live-sessions/${code}/events`,{method:'POST',body:JSON.stringify(body({event:name}))}).catch(()=>{})}function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function substitute(text){return String(text||'').replace(/\{\{lexicon_(\d+)\}\}/g,(_,n)=>lexicon[Number(n)-1]||`моя фраза №${n}`)}
let questions=[],qaOpen=false;function qaStatus(x){return x==='on_air'?'🔴 Відповідь в ефірі':x==='answered'?'✓ Відповіли':'У черзі'}function renderQuestions(){const list=$('qaList');if(!list)return;$('qaBadge').textContent=questions.filter(x=>x.status==='answered').length?`· ${questions.filter(x=>x.status==='answered').length}`:'';list.innerHTML=questions.length?questions.map(x=>`<article class="qa-item ${escape(x.status)}"><div class="qa-q">${escape(x.question)}</div>${x.answer?`<div class="qa-answer"><b>Відповідь:</b> ${escape(x.answer)}</div>`:''}<div class="qa-meta"><span>${qaStatus(x.status)}</span>${x.mine?'<span>· ваше</span>':`<button class="qa-vote" data-vote="${Number(x.id)}" ${x.voted?'disabled':''}>▲ ${Number(x.votes||0)}</button>`}</div></article>`).join(''):'<p class="small">Питань ще немає. Поставте перше — інші учні зможуть підтримати його голосом.</p>';list.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>voteQuestion(b.dataset.vote))}async function loadQuestions(){if(!code)return;try{const d=await json(`${api}/api/v1/live-sessions/${code}/questions`);questions=d.questions||[];renderQuestions()}catch(e){if(qaOpen)$('qaList').innerHTML=`<p class="small">${escape(e.message)}</p>`}}async function voteQuestion(id){try{await json(`${api}/api/v1/live-sessions/${code}/questions/${id}/vote`,{method:'POST',body:JSON.stringify(body())});await loadQuestions()}catch(e){alert(e.message)}}async function askQuestion(){const input=$('qaInput'),value=input.value.trim();if(value.length<3)return alert('Напишіть питання трохи детальніше.');$('qaSend').disabled=true;try{const d=await json(`${api}/api/v1/live-sessions/${code}/questions`,{method:'POST',body:JSON.stringify(body({question:value,context_step_id:currentId}))});input.value='';if(d.question?.instant_help)$('qaHint').innerHTML=`<div class="qa-hint"><b>Можливо, це вже допоможе:</b><br>${escape(d.question.instant_help)}<div class="small">Питання все одно залишилось у черзі ведучого.</div></div>`;await loadQuestions();try{TG?.HapticFeedback?.notificationOccurred('success')}catch(e){}}catch(e){alert(e.message)}finally{$('qaSend').disabled=false}}function toggleQuestions(open){qaOpen=open;$('qaSheet').classList.toggle('open',open);$('qaSheet').setAttribute('aria-hidden',String(!open));if(open)loadQuestions()}$('askOpen').onclick=()=>toggleQuestions(true);$('qaClose').onclick=()=>toggleQuestions(false);$('qaSheet').onclick=e=>{if(e.target===$('qaSheet'))toggleQuestions(false)};$('qaSend').onclick=askQuestion;
async function loadLexicon(){try{const d=await json(BOT+'/vocab_data',{method:'POST',body:JSON.stringify({uid:TG?.initDataUnsafe?.user?.id||0,init_data:TG?.initData||''})});const items=[...(d.due||[]),...(d.phrases||[])],seen=new Set;lexicon=items.map(x=>String(x.phrase||'').trim()).filter(x=>x&&!seen.has(x)&&seen.add(x)).slice(0,3)}catch(e){}const fallback=activity?.spec?.personalization?.fallback_lexicon||[];while(lexicon.length<3)lexicon.push(fallback[lexicon.length]||['work from home','learn English every day','meet new people'][lexicon.length])}function steps(){return activity?.spec?.steps||[]}function activeStep(){return steps().find(x=>x.id===currentId)||null}function progress(st){const list=steps(),i=Math.max(0,list.findIndex(x=>x.id===st?.id));$('bar').style.width=(st?(i+1)/list.length*100:0)+'%';$('counter').textContent=st?`${i+1}/${list.length}`:''}function renderWait(msg='Ведучий зараз відкриє наступне завдання.'){progress(null);screen.innerHTML=`<div class="wait"><div class="pulse"></div><b>${escape(msg)}</b><p class="small">Не закривайте екран — він оновиться автоматично.</p></div>`}
function render(){if(completed)return;const st=activeStep();if(!st)return renderWait();progress(st);const personal=/\{\{lexicon_/.test(JSON.stringify(st));screen.innerHTML=`<div class="topic">${escape(activity.title)}</div><div class="prompt">${escape(substitute(st.prompt||st.title||activity.title))}</div>${personal?'<div class="personal">🔒 Фраза взята з вашого особистого словника. Ведучий її не бачить.</div>':''}<div id="content"></div><div id="feedback" class="feedback"></div>`;const box=$('content');if(st.type==='information'){box.innerHTML=`<p>${escape(substitute(st.body||''))}</p><p class="small">Чекаємо, доки ведучий відкриє перше питання.</p>`;return}if(st.type==='single_choice'||st.type==='multi_choice'){(st.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=substitute(o.label);b.dataset.id=o.id;if(checks[st.id])paint(b,checks[st.id]);b.disabled=!!checks[st.id];b.onclick=()=>check(st,o.id);box.append(b)});showFeedback(st);return}box.innerHTML='<p class="small">Цей крок буде доступний у наступній версії шаблону.</p>'}function paint(btn,result){const id=btn.dataset.id,correct=(result.correct_option_ids||[]).includes(id);if(correct)btn.classList.add('correct');if(id===String(result.answer)&&!result.correct)btn.classList.add('wrong')}function showFeedback(st){const r=checks[st.id],f=$('feedback');if(!r||!f)return;f.className='feedback show '+(r.correct?'good':'bad');f.innerHTML=`<b>${r.correct?'Правильно ✓':'Спробу зафіксовано'}</b>${r.explanation?'<br>'+escape(r.explanation):''}${isLastAnswerable(st)?'<button class="button" id="finish">Завершити й записати у прогрес</button>':''}`;if($('finish'))$('finish').onclick=submit}function isLastAnswerable(st){const a=steps().filter(x=>x.type!=='information');return a[a.length-1]?.id===st.id&&a.every(x=>answers[x.id]!==undefined)}
async function check(st,answer){if(checks[st.id])return;[...screen.querySelectorAll('.option')].forEach(b=>b.disabled=true);try{event('started');const r=await json(`${api}/api/v1/live-sessions/${code}/check`,{method:'POST',body:JSON.stringify(body({step_id:st.id,answer}))});answers[st.id]=r.answer;checks[st.id]=r;try{TG?.HapticFeedback?.notificationOccurred(r.correct?'success':'error')}catch(e){}render()}catch(e){[...screen.querySelectorAll('.option')].forEach(b=>b.disabled=false);alert(e.message)}}function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}
async function submit(){if(submitting)return;submitting=true;const attemptId=uuid();screen.innerHTML='<div class="wait"><div class="pulse"></div><b>Записуємо результат у прогрес…</b></div>';try{const d=await json(`${api}/api/v1/live-sessions/${code}/attempts`,{method:'POST',body:JSON.stringify(body({attempt_id:attemptId,spec_version:activity.version,answers}))});await json(BOT+'/miniapp_action',{method:'POST',body:JSON.stringify(body({action:'live_lesson_done',attempt_id:attemptId,personal_lexicon:lexicon}))});completed=true;const r=d.result||{};$('bar').style.width='100%';screen.innerHTML=`<div class="done"><div class="topic">Результат у прогресі</div><div class="score">${Math.round(r.percent||0)}%</div><h2>${escape(r.outcome_label||'Виконано')}</h2><p>${escape(r.message||'Тему оновлено у вашій карті прогресу.')}</p><p class="small">Особисту лексику також заплановано в SRS.</p></div>`}catch(e){submitting=false;screen.innerHTML=`<div class="done"><h2>Не вдалося зберегти</h2><p>${escape(e.message)}</p><button class="button" id="retry">Повторити</button></div>`;$('retry').onclick=submit}}
async function poll(){if(completed||!code)return;try{const d=await json(`${api}/api/v1/live-sessions/${code}`);session=d.session;$('lesson').textContent=session.title||'Відкритий урок';if(session.activity&&!activity){activity=session.activity;await loadLexicon();event('opened')}const next=session.control?.current_step_id||null;if(activity&&next!==currentId){currentId=next;render()}}catch(e){}setTimeout(poll,2000)}setInterval(()=>{if(qaOpen)loadQuestions()},5000);if(!code)renderWait('У посиланні немає коду сесії.');else{json(`${api}/api/v1/live-sessions/${code}/register`,{method:'POST',body:JSON.stringify(body({source:'telegram_live'}))}).catch(()=>{});poll()}})();
</script></body></html>
