  .lvl small{display:block;font-size:var(--fs-xs);font-weight:600;opacity:.7}
  .vocab-card{background:var(--bg-card);border:0.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
  .vocab-card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .vocab-card .n{font-size:var(--fs-lg);font-weight:800;color:var(--green)}
  .vocab-card .lab{font-size:var(--fs-sm);color:var(--text2)}
  .vocab2{background:var(--bg-card);border:0.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
  .vocab2 .key-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .vocab2 .key-name{font-size:var(--fs);font-weight:700}
  .vocab2 .key-name small{font-size:var(--fs-xs);font-weight:400;color:var(--text2);margin-left:4px}
  .vocab2 .key-pct{font-size:var(--fs);font-weight:800;color:var(--purple)}
  .vocab2 .gap{font-size:var(--fs-xs);color:var(--text2);margin-top:6px}
  .vocab2 .active-row{display:flex;justify-content:space-between;align-items:center;
    margin-top:12px;padding-top:12px;border-top:0.5px solid var(--line)}
  .vocab2 .active-name{font-size:var(--fs);font-weight:700}
  .vocab2 .active-name small{display:block;font-size:var(--fs-xs);font-weight:400;color:var(--text2);margin-top:1px}
  .vocab2 .active-num{font-size:var(--fs-xl);font-weight:800;color:var(--green);text-align:right}
  .vocab2 .active-num .delta{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--green)}

  /* оверлей теми: 4 кроки */
  .step{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:13px 14px;margin-bottom:8px;
    border:0.5px solid var(--line);background:var(--bg-card2)}
  .step .si{width:36px;height:36px;border-radius:var(--r);flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:var(--fs-md);background:var(--bg-card3)}
  .step.done .si{background:var(--green-bg)}
  .step.next{background:var(--purple-bg);border-color:var(--purple)}
  .step.next .si{background:var(--purple);}
  .step.locked{opacity:.5}
  .step .body{flex:1;min-width:0}
  .step .t{font-size:var(--fs);font-weight:700}
  .step .s{font-size:var(--fs-xs);color:var(--text2);margin-top:1px}
  .step .st{font-size:var(--fs-md);flex-shrink:0;font-weight:800}
  .step.done .st{color:var(--green)}
  .step.next .st{color:var(--purple-text)}
  .step.locked .st{color:var(--text2)}
  /* таблиця правил (як Голіцинський) */
  .rule-table{background:var(--bg-card2);border:0.5px solid var(--line);border-radius:var(--r);
    overflow:hidden;margin:4px 0 10px}
  .rule-table .rr{display:flex;font-size:var(--fs-sm)}
  .rule-table .rr+.rr{border-top:0.5px solid var(--line)}
  .rule-table .rr .rl{flex:0 0 34%;padding:9px 12px;color:var(--text2);background:var(--bg-card);font-weight:600}
  .rule-table .rr .rv{flex:1;padding:9px 12px;font-family:ui-monospace,monospace}
  .rule-table .rr.head .rl,.rule-table .rr.head .rv{background:var(--purple-bg);color:var(--purple-text);font-weight:700;font-family:inherit}
  .topic{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg-card);
    border:0.5px solid var(--line);border-radius:var(--r);margin-bottom:7px;cursor:pointer}
  .topic:active{background:var(--bg-card2)}
  .topic .nm{font-size:var(--fs);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topic .tr{width:60px;height:5px;background:var(--bg-card3);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0}
  .topic .tr i{display:block;height:100%;border-radius:var(--r-sm)}
  .topic .pct{font-size:var(--fs-xs);font-weight:700;width:32px;text-align:right;flex-shrink:0}
  .g-green .tr i,.g-green.pct{background:var(--green)} .g-green.pct{color:var(--green);background:none}
  .g-yellow .tr i{background:var(--yellow)} .g-yellow.pct{color:var(--yellow)}
  .g-red .tr i{background:var(--red)} .g-red.pct{color:var(--red)}
  .g-gray .tr i{background:var(--bg-card3)} .g-gray.pct{color:var(--text2)}

  /* оверлеї */
  .overlay{position:absolute;inset:0;background:rgba(8,8,12,.82);z-index:50;display:none;
    align-items:flex-end;backdrop-filter:blur(2px)}
  .overlay.on{display:flex}
  .sheet{width:100%;background:var(--bg-card);border-top-left-radius:22px;border-top-right-radius:22px;
    padding:20px 18px 26px;border-top:0.5px solid var(--line)}
  .sheet .grip{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px}
  .sheet h3{font-size:var(--fs-md);font-weight:800;margin-bottom:6px}
  .sheet p{font-size:var(--fs);color:var(--text2);margin-bottom:14px;line-height:1.5}
  .sheet textarea,.sheet input.vid{width:100%;background:var(--bg-card2);border:0.5px solid var(--line);
    border-radius:var(--r);padding:13px 14px;color:var(--text);font-size:var(--fs);outline:none;font-family:inherit;resize:none}
  .sheet textarea:focus,.sheet input.vid:focus{border-color:var(--purple)}
  .sheet .go{margin-top:14px;width:100%;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;
    border:none;padding:14px 0;border-radius:var(--r-pill);font-size:var(--fs);font-weight:800;cursor:pointer}
  .sheet .ex{font-size:var(--fs-sm);color:var(--text2);margin-top:10px;line-height:1.6}
  .sheet .ex b{color:var(--purple-text)}

  /* YouTube значок */
  .yt{display:inline-flex;align-items:center;justify-content:center;width:30px;height:21px;
    background:#ff0000;border-radius:var(--r-sm);vertical-align:middle}
  .yt::after{content:'';border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #fff;margin-left:1px}
  .dot .yt{width:26px;height:18px}

  /* Мережа: ваші ланцюжки */
  .friend-chain{display:flex;align-items:center;gap:12px;background:var(--bg-card);
    border:0.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
  .friend-chain .av{width:38px;height:38px;border-radius:50%;background:var(--purple-bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:var(--fs);font-weight:800;color:var(--purple)}
  .friend-chain .info{flex:1;min-width:0}
  .friend-chain .nm{font-size:var(--fs);font-weight:700}
  .friend-chain .rl{font-size:var(--fs-xs);color:var(--text2)}
  .mini-links{display:flex;gap:3px;flex-shrink:0}
  .mini-links .ml{width:11px;height:11px;border-radius:var(--r-sm);background:var(--bg-card3)}
  .mini-links .ml.on{background:var(--purple)}
  .friend-chain .cnt{font-size:var(--fs);font-weight:800;color:var(--purple);width:16px;text-align:right;flex-shrink:0}

  /* пара плиток виклику */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .pair-tile{border-radius:var(--r);padding:15px 13px;cursor:pointer;transition:transform .1s;border:0.5px solid var(--line)}
  .pair-tile:active{transform:scale(.97)}
  .pair-tile.accent{background:var(--purple-bg);border-color:var(--purple)}
  .pair-tile .ic{font-size:var(--fs-lg);display:block;margin-bottom:8px}
  .pair-tile .t{font-size:var(--fs);font-weight:700}
  .pair-tile .s{font-size:var(--fs-xs);color:var(--text2);margin-top:2px}
  .pair-tile.accent .t{color:var(--purple-text)} .pair-tile.accent .s{color:var(--purple-text)}

  /* Speaking Partners — чат у Telegram */
  .partner-chat{display:flex;align-items:center;gap:12px;background:var(--bg-card);
    border:0.5px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px}
  .partner-chat .av2{width:42px;height:42px;border-radius:50%;background:var(--purple-bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:var(--fs);font-weight:800;color:var(--purple-text)}
  .partner-chat .body{flex:1;min-width:0}
  .partner-chat .nm{font-size:var(--fs);font-weight:700}
  .partner-chat .rl{font-size:var(--fs-xs);color:var(--text2);margin-top:1px}
  .partner-chat .tg-btn{display:flex;align-items:center;gap:6px;background:var(--telegram);color:#fff;
    border:none;border-radius:99px;padding:8px 14px;font-size:var(--fs-sm);font-weight:800;cursor:pointer;flex-shrink:0}
  .partner-note{background:var(--purple-bg);border:0.5px dashed var(--purple);border-radius:var(--r);
    padding:11px 14px;font-size:11.5px;color:var(--purple-text);line-height:1.5}

  /* дуельна стрічка */
  .score{display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);
    border:0.5px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:12px}
  .score .sd{text-align:center;flex:1}
  .score .sn{font-size:var(--fs-xl);font-weight:800;color:var(--purple)}
  .score .sd.them .sn{color:var(--text2)}
  .score .sl{font-size:var(--fs-xs);color:var(--text2);margin-top:1px}
  .score .vs{font-size:var(--fs-xs);color:var(--text2);letter-spacing:1px}
  .duel{background:var(--bg-card);border:0.5px solid var(--line);border-radius:var(--r);
    padding:12px 14px;margin-bottom:8px}
  .duel.win{border-left:3px solid var(--green)}
  .duel.lose{border-left:3px solid var(--line)}
  .duel .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .duel .ph{font-size:var(--fs);font-weight:700}
  .duel .dt{font-size:var(--fs-xs);color:var(--text2);flex-shrink:0;margin-left:8px}
  .duel .plays{display:flex;gap:8px}
  .play-chip{flex:1;display:flex;align-items:center;gap:7px;background:var(--bg-card2);
    border:0.5px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;min-width:0}
  .play-chip:active{background:var(--bg-card3)}
  .play-chip.best{background:var(--purple-bg);border-color:var(--purple)}
  .play-chip .pi{font-size:var(--fs-sm);flex-shrink:0}
  .play-chip .pl{font-size:var(--fs-xs);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .play-chip.best .pl{color:var(--purple-text)}
  .duel .verdict{font-size:var(--fs-xs);margin-top:8px;font-weight:600}
  .duel.win .verdict{color:var(--green)}
  .duel.lose .verdict{color:var(--text2)}
  .waiting{background:var(--purple-bg);border:0.5px solid var(--orange);border-radius:var(--r);
    padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .waiting .wt{font-size:var(--fs-sm);font-weight:700;color:var(--orange)}
  .waiting .wp{font-size:var(--fs-xs);color:var(--gold);margin-top:1px}
  .waiting .wb{background:var(--orange);color:var(--purple-bg);border:none;border-radius:99px;
    padding:8px 14px;font-size:var(--fs-xs);font-weight:800;cursor:pointer;flex-shrink:0}
  .duel-actions{display:flex;gap:8px;margin-top:12px}
  .duel-actions button{flex:1;border:none;border-radius:99px;padding:12px 0;font-size:var(--fs);font-weight:800;cursor:pointer}
  .duel-actions .throw{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff}
  .duel-actions .tg{background:var(--telegram);color:#fff}

  /* бонуси за мережу */
  .bonus-row{display:flex;align-items:center;gap:12px;background:var(--bg-card);
    border:0.5px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px}
  .bonus-row .txt{flex:1}
  .bonus-row .bt{font-size:var(--fs);font-weight:700}
  .bonus-row .bs{font-size:var(--fs-xs);color:var(--text2);margin-top:2px}
  .bonus-row .rew{font-size:var(--fs-lg);flex-shrink:0}

  /* рейтинг: періоди + категорії */
  .period-pills{display:flex;gap:6px;margin-bottom:10px}
  .period-pill{flex:1;text-align:center;background:var(--bg-card2);border:0.5px solid var(--line);
    color:var(--text2);padding:8px 0;border-radius:var(--r-pill);font-size:var(--fs);font-weight:600;cursor:pointer}
  .period-pill.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple-text)}
  .cat-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-bottom:12px}
  .cat-tabs::-webkit-scrollbar{display:none}

  /* обгортка з градієнтом і стрілками для гортання */
  .scroller{position:relative}
  .scroller::after{content:'';position:absolute;right:0;top:0;bottom:0;width:44px;
    background:linear-gradient(90deg,transparent,var(--bg) 70%);pointer-events:none;z-index:2;
    opacity:1;transition:opacity .2s}
  .scroller.at-end::after{opacity:0}
  .scroller::before{content:'';position:absolute;left:0;top:0;bottom:0;width:32px;
    background:linear-gradient(270deg,transparent,var(--bg) 70%);pointer-events:none;z-index:2;
    opacity:0;transition:opacity .2s}
  .scroller.scrolled::before{opacity:1}
  .sc-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:26px;height:26px;border-radius:50%;background:var(--bg-card2);border:0.5px solid var(--line);
    color:var(--text);display:flex;align-items:center;justify-content:center;
    font-size:var(--fs);font-weight:800;cursor:pointer;transition:opacity .2s;padding:0;line-height:1;
    box-shadow:0 0 8px rgba(0,0,0,.6)}
  .sc-arrow:active{background:var(--bg-card3)}
  .sc-arrow.right{right:2px}
  .sc-arrow.left{left:2px;opacity:0;pointer-events:none}
  .scroller.scrolled .sc-arrow.left{opacity:1;pointer-events:auto}
  .scroller.at-end .sc-arrow.right{opacity:0;pointer-events:none}
  .cat-tab{flex-shrink:0;background:var(--bg-card2);border:0.5px solid var(--line);color:var(--text2);
    padding:6px 11px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;cursor:pointer;white-space:nowrap}
  .cat-tab.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple-text)}

  /* досягнення / бейджі — 23.07: фіксований компактний розмір замість
     "росте з шириною колонки" (запит власниці "зменшити значки"). */
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,64px);gap:8px;margin-bottom:6px;justify-content:start}
  .ach{width:64px;height:64px;background:var(--bg-card);border:0.5px solid var(--line);border-radius:var(--r);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
  .ach.got{background:var(--purple-bg);border-color:var(--purple)}
  .ach.lock{opacity:.4;filter:grayscale(1)}
  .ach .e{font-size:18px}
  .ach .n{font-size:9px;color:var(--text2);text-align:center;line-height:1.1}
  .ach.got .n{color:var(--purple-text)}
  /* ── Лотерейні квитки: візуальна колекція, а не технічний список ── */
  .ticket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ticket-card{position:relative;min-width:0;padding:13px 12px 12px;border-radius:14px;
    overflow:hidden;background:linear-gradient(145deg,#f6d867,#e9ad31);color:#2d2408;
    box-shadow:0 8px 22px rgba(0,0,0,.16)}
  .ticket-card::before,.ticket-card::after{content:'';position:absolute;top:50%;width:16px;height:16px;
    margin-top:-8px;border-radius:50%;background:var(--bg-card);z-index:2}
  .ticket-card::before{left:-8px}.ticket-card::after{right:-8px}
  .ticket-brand{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.68}
  .ticket-number{margin:15px 0 4px;font-size:17px;font-weight:900;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ticket-caption{padding-top:8px;border-top:1px dashed rgba(45,36,8,.32);
    font-size:10px;font-weight:750;display:flex;justify-content:space-between;gap:5px}
  .ticket-empty{padding:28px 18px;text-align:center;border:1px dashed var(--line);
    border-radius:var(--r);background:var(--bg-card);color:var(--text2);font-size:var(--fs-sm);line-height:1.5}
  .ticket-empty .ic{display:block;font-size:34px;margin-bottom:8px}
  .xp-summary{display:flex;gap:10px;margin-bottom:14px}
  .xp-box{flex:1;background:var(--bg-card);border:0.5px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
  .xp-box .v{font-size:var(--fs-lg);font-weight:800;color:var(--purple)}
  .xp-box .l{font-size:var(--fs-xs);color:var(--text2);margin-top:2px}
  .unsub{text-align:center;font-size:var(--fs-xs);color:var(--text2);text-decoration:underline;
    cursor:pointer;margin-top:10px;padding:6px}
  .premium-banner{background:linear-gradient(135deg,var(--gold),var(--gold));border-radius:var(--r);
    padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .premium-banner .ic{font-size:var(--fs-lg)}
  .premium-banner .t{font-size:var(--fs);font-weight:800;color:var(--purple-bg)}
  .premium-banner .s{font-size:var(--fs-xs);color:var(--purple-bg)}

  /* екран Слухати */
  .now-playing{background:linear-gradient(135deg,var(--purple),var(--purple-dark));border-radius:var(--r);
    padding:16px;margin-bottom:12px;color:#fff}
  .now-playing .lbl{font-size:var(--fs-xs);color:var(--purple-text);text-transform:uppercase;letter-spacing:.5px}
  .now-playing .ttl{font-size:var(--fs-md);font-weight:800;margin:4px 0 2px}
  .now-playing .meta{font-size:var(--fs-sm);color:var(--purple-text)}
  .np-controls{display:flex;align-items:center;gap:16px;margin-top:14px}
  .np-controls .play{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--purple-dark);
    display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);border:none;cursor:pointer;flex-shrink:0}
  .np-bar{flex:1;height:5px;background:rgba(255,255,255,.25);border-radius:99px;position:relative}
  .np-bar i{position:absolute;left:0;top:0;height:100%;width:38%;background:#fff;border-radius:99px}
  .np-time{font-size:var(--fs-xs);color:var(--purple-text);flex-shrink:0}
  .mode-row{display:flex;gap:8px;margin-bottom:14px}
  .mode-card{flex:1;background:var(--bg-card);border:0.5px solid var(--line);border-radius:var(--r);
    padding:12px;cursor:pointer;transition:all .15s}
  .mode-card.on{background:var(--purple-bg);border-color:var(--purple)}
  .mode-card .e{font-size:var(--fs-lg);display:block;margin-bottom:6px}
  .mode-card .t{font-size:var(--fs);font-weight:700}
  .mode-card.on .t{color:var(--purple-text)}
  .mode-card .s{font-size:var(--fs-xs);color:var(--text2);margin-top:2px}
  .pod{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:0.5px solid var(--line);
    border-radius:var(--r);padding:11px 13px;margin-bottom:8px;cursor:pointer}
  .pod:active{background:var(--bg-card2)}
  .pod .co{width:42px;height:42px;border-radius:var(--r-sm);flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:var(--fs-lg);background:var(--bg-card3)}
  .pod .body{flex:1;min-width:0}
  .pod .nm{font-size:var(--fs);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod .dt{font-size:var(--fs-xs);color:var(--text2)}
  .pod .lvl-tag{font-size:var(--fs-xs);font-weight:700;padding:2px 7px;border-radius:99px;flex-shrink:0}
  .pod .lvl-tag.a{background:var(--green-bg);color:var(--green)}
  .pod .lvl-tag.b{background:var(--purple-bg);color:var(--purple-text)}
  .instr-card{background:var(--bg-card);border:0.5px solid var(--line);border-radius:var(--r);
    padding:14px 16px;margin-bottom:8px;font-size:12.5px;color:var(--text2);line-height:1.6}
  .instr-card b{color:var(--text)}
  .instr-note{background:var(--purple-bg);border:0.5px dashed var(--purple);border-radius:var(--r);
    padding:12px 14px;font-size:11.5px;color:var(--purple-text);line-height:1.5;margin-bottom:8px}
  .topic-locked{opacity:.55;cursor:default}
  .lock-ico{font-size:var(--fs-sm);opacity:.7}
  .diag-cta{display:block;width:100%;margin-top:10px;padding:13px;border:none;border-radius:var(--r);

  /* ── Лотерея живе у профілі: один зрозумілий вхід і весь стан одразу ── */
  .lottery-card{position:relative;margin:0 0 10px;padding:15px;border-radius:16px;overflow:hidden;

    border:1px solid rgba(245,200,66,.34);cursor:pointer}
  .lottery-card::after{content:'🎟';position:absolute;right:-8px;top:-20px;font-size:82px;
    opacity:.07;transform:rotate(15deg);pointer-events:none}
  .lottery-top{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .lottery-top .body{flex:1;min-width:0}
  .lottery-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    flex-shrink:0;background:rgba(245,200,66,.18);font-size:22px}
  .lottery-title{font-size:var(--fs-md);font-weight:850;color:var(--text)}
  .lottery-prize{font-size:var(--fs-xs);color:var(--text2);margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .lottery-count-badge{padding:5px 8px;border-radius:99px;background:rgba(245,200,66,.16);
    color:var(--gold);font-size:10px;font-weight:850;white-space:nowrap}
  .lottery-track{height:9px;background:var(--bg-card2);border-radius:99px;overflow:hidden;margin-bottom:7px}
  .lottery-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--purple));
    transition:width .5s}
  .lottery-meta{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-xs);
    color:var(--text2);margin-bottom:11px}
  .lottery-meta strong{color:var(--text);font-weight:800}
  .lottery-actions{position:relative;z-index:1;display:grid;grid-template-columns:1.35fr 1fr;gap:7px}
  .lottery-btn,.lottery-view-btn{min-width:0;padding:11px 8px;border-radius:11px;border:none;
    font-size:var(--fs-sm);font-weight:800;cursor:pointer}
  .lottery-btn{background:var(--gold);color:#241d00}
  .lottery-btn:disabled{background:var(--bg-card2);color:var(--text2);cursor:not-allowed;opacity:1}
  .lottery-view-btn{background:var(--bg-card);color:var(--text);border:.5px solid var(--line)}
  .lottery-loading{height:144px;border-radius:16px;background:linear-gradient(90deg,var(--bg-card) 25%,
    var(--bg-card2) 50%,var(--bg-card) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  .lottery-sheet-summary{padding:15px;margin-bottom:16px;border-radius:16px;
    background:linear-gradient(145deg,rgba(245,200,66,.16),rgba(124,110,247,.10));
    border:1px solid rgba(245,200,66,.30)}
  .lottery-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
  .lottery-sheet-head b{display:block;font-size:17px}.lottery-sheet-head span{display:block;
    margin-top:3px;color:var(--text2);font-size:var(--fs-xs);line-height:1.4}
  .lottery-sheet-count{font-size:24px;font-weight:900;color:var(--gold);white-space:nowrap}
  .lottery-sheet-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
  .lottery-sheet-stat{padding:9px 10px;border-radius:11px;background:var(--bg-card)}
  .lottery-sheet-stat b{display:block;font-size:16px;color:var(--text)}
  .lottery-sheet-stat span{display:block;margin-top:2px;color:var(--text2);font-size:10px}
  .lottery-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 0 9px;font-size:var(--fs);font-weight:850}
  .lottery-section-title span{color:var(--text2);font-size:var(--fs-xs);font-weight:650}
  /* ── Прогалини (Розділ L, v59-60) — бекенд рахував завжди,
     ніде не показувалось. Найслабші 2-3 теми свого рівня й нижче,
     мотивують підтягнути фундамент. ── */
  .gaps-card{margin:0 0 14px;padding:14px;border-radius:var(--r);
    background:rgba(247,110,110,.08);border:1px solid rgba(247,110,110,.22)}
  .gaps-title{font-size:var(--fs-xs);font-weight:700;color:var(--red);text-transform:uppercase;
    letter-spacing:.06em;margin-bottom:8px}
  .gap-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 0;border-bottom:.5px solid rgba(247,110,110,.15)}
  .gap-row:last-child{border-bottom:none}
  .gap-label{font-size:var(--fs-sm);color:var(--text)}
  .gap-lvl{font-size:var(--fs-xs);color:var(--text2);margin-left:6px}
  .gap-known{font-size:var(--fs-xs);color:var(--red);font-weight:700;flex-shrink:0}

  /* стрічка вхідних на головному */
  .inbox-hd{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
  .inbox-hd .ti{font-size:var(--fs);font-weight:800}
  .inbox-hd .badge{background:var(--red);color:#fff;font-size:var(--fs-xs);font-weight:800;
    min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .incoming{display:flex;align-items:center;gap:12px;border-radius:var(--r);
    padding:13px 14px;margin-bottom:8px;cursor:pointer;transition:transform .1s}
  .incoming:active{transform:scale(.985)}
  .incoming.phrase{background:linear-gradient(135deg,var(--purple),var(--purple-dark))}
  .incoming.chall{background:var(--bg-card);border:0.5px solid var(--line)}
  .incoming .av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-size:17px}
  .incoming.phrase .av{background:rgba(255,255,255,.2)}
  .incoming.chall .av{background:var(--purple-bg);font-size:var(--fs);font-weight:800;color:var(--purple-text)}
  .incoming .body{flex:1;min-width:0}
  .incoming .t{font-size:var(--fs);font-weight:700}

  .incoming .s{font-size:var(--fs-xs);margin-top:1px}
  .incoming.phrase .s{color:var(--purple-text)}
  .incoming.chall .s{color:var(--text2)}
  .incoming .cta{font-size:var(--fs-xs);font-weight:800;padding:6px 12px;border-radius:99px;flex-shrink:0}
  .incoming.phrase .cta{background:#fff;color:var(--purple-dark)}
  .incoming.chall .cta{background:var(--purple);color:#fff}

  /* ══ SOCIAL PRACTICE ══ */
  .social-head{display:flex;align-items:flex-start;gap:12px;margin:4px 0 12px}
  .social-head>div{flex:1}.social-head h2{font-size:20px;line-height:1.2;margin:2px 0 0}
  .social-kicker{font-size:var(--fs-xs);font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.05em}
  .social-settings{width:38px;height:38px;border:0;border-radius:50%;background:var(--bg-card2);
    color:var(--text);font-size:18px;cursor:pointer}
  .friends-value-card{margin:0 0 12px;padding:14px;border-radius:16px;
    background:linear-gradient(145deg,rgba(124,110,247,.16),rgba(90,216,166,.07));
    border:1px solid rgba(124,110,247,.28)}
  .friends-value-main{display:flex;align-items:center;gap:11px}
  .friends-value-copy{flex:1;min-width:0}
  .friends-value-kicker{font-size:10px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:var(--purple)}
  .friends-value-title{margin:3px 0 3px;font-size:17px;line-height:1.22}
  .friends-value-sub{font-size:var(--fs-xs);line-height:1.4;color:var(--text2)}
  .friends-invite-btn{flex-shrink:0;border:0;border-radius:11px;padding:10px 12px;

  .friends-rewards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px}
  .friends-reward{min-width:0;padding:8px 9px;border-radius:10px;background:var(--bg-card)}
  .friends-reward b{display:block;font-size:var(--fs-xs);line-height:1.25;color:var(--text)}
  .friends-reward small{display:block;margin-top:3px;color:var(--text2);font-size:9px;line-height:1.25}
  .friends-more{margin-top:9px;border-top:.5px solid rgba(124,110,247,.22)}
  .friends-more summary{padding:10px 1px 1px;list-style:none;cursor:pointer;color:var(--text2);
    font-size:var(--fs-xs);font-weight:800}
  .friends-more summary::-webkit-details-marker{display:none}
  .friends-more summary::after{content:'⌄';float:right;color:var(--purple)}
  .friends-more[open] summary::after{content:'⌃'}
  .friends-layer-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
  .friends-layer-actions button{display:flex;align-items:center;gap:8px;min-width:0;padding:10px;
    border:.5px solid var(--line);border-radius:11px;background:var(--bg-card);color:var(--text);
    text-align:left;font-size:var(--fs-xs);font-weight:800;cursor:pointer}
  .friends-layer-actions button span{font-size:17px;flex-shrink:0}
  .social-live-card{display:flex;align-items:center;gap:11px;padding:13px 14px;margin-bottom:12px;
    border-radius:var(--r);background:linear-gradient(135deg,#30275b,#18162a);color:#fff;cursor:pointer}
  .social-live-card .body{flex:1}.social-live-card .t{font-size:var(--fs);font-weight:800}
  .social-live-card .s{font-size:var(--fs-xs);color:#c9c2ff;margin-top:2px}
  .live-dot{width:10px;height:10px;border-radius:50%;background:#5ad8a6;box-shadow:0 0 0 5px rgba(90,216,166,.16)}
  .social-arrow{font-size:24px;color:#c9c2ff}
  .social-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin-bottom:12px;
    border-radius:var(--r-pill);background:var(--bg-card2)}
  .social-tabs button{border:0;background:none;color:var(--text2);padding:9px 4px;border-radius:var(--r-pill);
    font-size:var(--fs-sm);font-weight:750;cursor:pointer}
  .social-tabs button.on{background:var(--bg-card);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .social-tabs button span:not(:empty){display:inline-flex;min-width:17px;height:17px;align-items:center;justify-content:center;
    padding:0 4px;margin-left:2px;border-radius:99px;background:var(--red);color:#fff;font-size:10px}
  .social-panel{display:none}.social-panel.on{display:block}
  .social-quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .social-quick-grid button{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;
    border:0;border-radius:var(--r);background:var(--purple-bg);color:var(--purple-text);font-weight:800;cursor:pointer}
  .social-quick-grid button span{font-size:18px}
  .practice-post{overflow:hidden;margin-bottom:12px;border:.5px solid var(--line);border-radius:var(--r);
    background:var(--bg-card)}
  .practice-post-head{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
  .social-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--purple-bg);color:var(--purple-text);font-weight:850;flex:none;overflow:hidden}
  .social-avatar img{width:100%;height:100%;object-fit:cover}
  .practice-post-head .who{flex:1;min-width:0}.practice-post-head .nm{font-size:var(--fs);font-weight:800}
  .practice-post-head .meta{font-size:var(--fs-xs);color:var(--text2);margin-top:1px}
  .source-badge{display:inline-flex;align-items:center;padding:4px 7px;border-radius:99px;background:var(--purple-bg);
    color:var(--purple-text);font-size:10px;font-weight:800}
  .practice-media{position:relative;background:#111;min-height:154px;display:flex;align-items:center;justify-content:center}
  .practice-media video{width:100%;max-height:420px;display:block;background:#111}
  .practice-media audio{width:calc(100% - 24px);margin:36px 12px}
  .practice-media.text-only{min-height:116px;padding:20px;background:linear-gradient(135deg,var(--purple-bg),var(--bg-card2));
    color:var(--text);font-size:18px;font-weight:750;line-height:1.4}
  .practice-copy{padding:12px}.practice-topic{font-size:var(--fs);font-weight:800;line-height:1.35}
  .practice-transcript{font-size:var(--fs-sm);line-height:1.45;color:var(--text2);margin-top:6px}
  .practice-phrase{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:8px;background:var(--purple-bg);
    color:var(--purple-text);font-size:var(--fs-xs);font-weight:700}
  .practice-actions{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
  .practice-actions button{border:0;border-radius:10px;padding:10px 9px;background:var(--bg-card2);
    color:var(--text);font-size:var(--fs-xs);font-weight:800;cursor:pointer}
  .practice-actions .reply{background:var(--purple);color:#fff;flex:1 0 45%}
  .social-empty{padding:24px 18px;text-align:center;border:.5px dashed var(--line);border-radius:var(--r);
    background:var(--bg-card);color:var(--text2)}
  .social-empty .ic{display:block;font-size:34px;margin-bottom:8px}.social-empty b{display:block;color:var(--text);margin-bottom:4px}
  .social-person{display:flex;align-items:center;gap:11px;padding:12px;margin-bottom:8px;border:.5px solid var(--line);
    border-radius:var(--r);background:var(--bg-card);cursor:pointer}
  .social-person .body{flex:1;min-width:0}.social-person .nm{font-size:var(--fs);font-weight:800}
  .social-person .sub{font-size:var(--fs-xs);color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .social-person .challenge-btn{border:0;border-radius:99px;padding:8px 10px;background:var(--purple);
    color:#fff;font-size:11px;font-weight:800;cursor:pointer}
  .social-match{background:linear-gradient(135deg,var(--purple-bg),var(--bg-card));border-color:rgba(124,110,247,.3)}
  .social-invite{padding:13px;margin-bottom:8px;border:.5px solid var(--line);border-radius:var(--r);background:var(--bg-card)}
  .social-invite-top{display:flex;align-items:center;gap:9px}.social-invite-top .body{flex:1}
  .social-invite .topic{font-size:var(--fs-sm);line-height:1.4;color:var(--text2);margin:9px 0}
  .social-invite-actions{display:flex;gap:7px}.social-invite-actions button{flex:1;border:0;border-radius:10px;
    padding:9px;font-size:var(--fs-xs);font-weight:800;cursor:pointer}
  .social-invite-actions .accept{background:var(--purple);color:#fff}.social-invite-actions .decline{background:var(--bg-card2);color:var(--text2)}
  .profile-video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}
  .profile-video-grid>div{aspect-ratio:1;border-radius:10px;background:var(--purple-bg);display:flex;align-items:center;
    justify-content:center;font-size:22px;cursor:pointer;overflow:hidden}
  .profile-video-grid video{width:100%;height:100%;object-fit:cover}
  .privacy-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
  .privacy-row button{border:.5px solid var(--line);border-radius:10px;padding:9px 4px;background:var(--bg-card2);
    color:var(--text2);font-size:11px;font-weight:700;cursor:pointer}
  .privacy-row button.on{border-color:var(--purple);background:var(--purple-bg);color:var(--purple-text)}
  .record-stage{margin-top:12px;padding:18px;text-align:center;border-radius:var(--r);background:var(--bg-card2)}
  .record-clock{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums}
  .record-preview{width:100%;max-height:300px;margin-top:10px;border-radius:12px;background:#111}
  .record-state{font-size:var(--fs-sm);color:var(--text2);margin:6px 0 12px}
  .record-main{width:64px;height:64px;border:6px solid rgba(255,255,255,.55);border-radius:50%;
    background:var(--red);box-shadow:0 0 0 3px var(--red);cursor:pointer}
  .live-room-head{display:flex;align-items:center;gap:10px;padding:10px 0}.live-room-head .body{flex:1}
  .live-timer{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--purple)}
  .live-messages{max-height:230px;overflow-y:auto;margin:10px 0;padding:10px;border-radius:var(--r);

  .live-message.mine{margin-left:28px;background:var(--purple-bg)}
  .field-label{display:block;margin:13px 0 6px;font-size:var(--fs-xs);font-weight:800;color:var(--text2)}
  .field-input{box-sizing:border-box;width:100%;padding:11px 12px;border:.5px solid var(--line);border-radius:11px;
    background:var(--bg-card2);color:var(--text);font:inherit;outline:none;resize:vertical}
  .field-input:focus{border-color:var(--purple);box-shadow:0 0 0 2px rgba(124,110,247,.12)}
  .toggle-line{display:flex;align-items:center;gap:9px;padding:10px 0;font-size:var(--fs-sm);color:var(--text)}
  .toggle-line input{width:18px;height:18px;accent-color:var(--purple)}
  .social-offline{display:none;margin:0 0 10px;padding:9px 11px;border-radius:10px;
    background:rgba(247,169,92,.13);border:1px solid rgba(247,169,92,.28);color:var(--orange);
    font-size:var(--fs-xs);font-weight:750}
  .social-offline.on{display:block}
  .today-social-strip{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:3px}
  .today-speak-card{flex:0 0 78%;overflow:hidden;border:.5px solid var(--line);border-radius:var(--r);
    background:var(--bg-card);scroll-snap-align:start}
  .today-speak-media{height:158px;background:linear-gradient(135deg,var(--purple-bg),var(--bg-card2));
    display:flex;align-items:center;justify-content:center;font-size:34px}
  .today-speak-media video{width:100%;height:100%;object-fit:cover;background:#111}
  .today-speak-media audio{width:calc(100% - 20px)}
  .today-speak-body{display:flex;align-items:center;gap:8px;padding:10px}.today-speak-body .body{flex:1;min-width:0}
  .today-speak-body .nm{font-size:var(--fs-sm);font-weight:800}.today-speak-body .sub{font-size:var(--fs-xs);
    color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .moderation-note{margin:0 12px 10px;padding:7px 9px;border-radius:9px;background:rgba(247,169,92,.12);
    color:var(--orange);font-size:var(--fs-xs);line-height:1.35}
  .draft-resume{display:none;align-items:center;gap:8px;margin:12px 0 2px;padding:10px 11px;

  /* компактна шапка профілю */
  .prof-head{display:flex;align-items:center;gap:14px;margin:8px 0 16px}
  .prof-head .av{width:52px;height:52px;border-radius:50%;background:var(--purple-bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);font-weight:800;color:var(--purple-text)}
  .prof-head .nm{font-size:17px;font-weight:800}
  .prof-head .sub{font-size:var(--fs-sm);color:var(--text2);margin-top:2px}
  /* згрупований список-меню (плитки-рядки) */
  .menu-group{display:flex;flex-direction:column;background:var(--bg-card);border:0.5px solid var(--line);
    border-radius:var(--r);overflow:hidden;margin-bottom:8px}
  .menu-group .mi{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;transition:background .12s}
  .menu-group .mi:active{background:var(--bg-card2)}

  .menu-group .mi .ic{font-size:19px;width:24px;text-align:center;flex-shrink:0}
  .menu-group .mi .body{flex:1;min-width:0}
  .menu-group .mi .t{font-size:var(--fs);font-weight:600}
  .menu-group .mi .s{font-size:var(--fs-xs);color:var(--text2)}
  .menu-group .mi .ch{color:var(--text2);font-size:var(--fs-md);flex-shrink:0}

  /* bottom nav */
  .nav{display:flex;flex-shrink:0;border-top:0.5px solid var(--line);background:var(--bg-card);
    padding:8px 4px 10px}

function lotteryTicketCode(ticket,index){
  if(ticket&&typeof ticket==='object'){
    return String(ticket.number||ticket.ticket||ticket.code||ticket.id||('SC-'+String(index+1).padStart(4,'0')));
  }
  return String(ticket||('SC-'+String(index+1).padStart(4,'0')));
}
function lotteryTicketHtml(ticket,index){
  const code=lotteryTicketCode(ticket,index);
  return '<div class="ticket-card"><div class="ticket-brand">SpeakChain Lottery</div>'
    +'<div class="ticket-number">'+esc(code)+'</div>'
    +'<div class="ticket-caption"><span>Квиток '+(index+1)+'</span><span>дійсний</span></div></div>';
}

/* Детальний екран: спочатку пояснює, що відбувається з 100 ланками,
   потім показує колекцію фізично схожих на квитки карток. */
async function openLotteryTickets(){
  openOv('ov-lottery');
  const host=$('#ov-lottery-list');
  if(!host) return;
  host.innerHTML='<div class="lottery-loading" aria-label="Завантажуємо квитки"></div>';
  try{
    const res=await fetch(BOT_API+'/lottery_status',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({uid:UID,init_data:IDT})});
    const d=await res.json();
    if(!res.ok||!d||!d.ok) throw new Error('lottery_status');
    const links=Math.max(0,Number(d.lottery_links)||0);
    const needed=Math.max(1,Number(d.links_needed)||100);
    const remaining=Math.max(0,needed-links);
    const pct=Math.min(100,Math.round(links/needed*100));
    const canBuy=Boolean(d.has_active)&&links>=needed;
    const tickets=(d&&d.my_tickets)||[];
    const prize=d.has_active?(d.prize||'Приз оголосимо скоро'):'Новий розіграш готується';
    host.innerHTML='<div class="lottery-sheet-summary">'
      +'<div class="lottery-sheet-head"><div><b>'+esc(prize)+'</b>'
      +'<span>Кожні '+needed+' доступних ланок можна обміняти на один квиток.</span></div>'
      +'<div class="lottery-sheet-count">'+tickets.length+' 🎟</div></div>'
      +'<div class="lottery-track"><div class="lottery-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="lottery-sheet-stats">'
      +'<div class="lottery-sheet-stat"><b>'+links+' / '+needed+'</b><span>доступних ланок</span></div>'
      +'<div class="lottery-sheet-stat"><b>'+(canBuy?'Готово':remaining)+'</b><span>'
      +(canBuy?'можна купувати':pluralUk(remaining,'ланка потрібна','ланки потрібні','ланок потрібно'))+'</span></div></div>'
      +'<button class="lottery-btn" style="width:100%" id="lottery-overlay-buy" '+(canBuy?'':'disabled')
      +' onclick="buyLotteryTicket(\'profile-lottery\',\'lottery-overlay-buy\',true)">'
      +(canBuy?'Купити квиток за '+needed+' ланок':d.has_active?'Ще '+remaining+' ланок до квитка':'Розіграш готується')
      +'</button></div>'
      +'<div class="lottery-section-title">Мої квитки <span>'+tickets.length+' у колекції</span></div>'
      +(tickets.length?'<div class="ticket-grid">'+tickets.map(lotteryTicketHtml).join('')+'</div>'
        :'<div class="ticket-empty"><span class="ic">🎟</span><b>Поки немає квитків</b><br>'
          +'Збирай ланки разом із друзями. Коли буде '+needed+', кнопка купівлі стане активною.</div>');
  }catch(e){
    host.innerHTML='<div class="ticket-empty"><span class="ic">↻</span><b>Не вдалося завантажити лотерею</b><br>'
      +'Перевір зв’язок і натисни нижче.'
      +'<button class="diag-cta" onclick="openLotteryTickets()">Спробувати ще раз</button></div>';
  }
}

function money(v){
  const f=parseFloat(v);
  if(!isFinite(f)) return String(v??'');
  return f===Math.trunc(f)?String(Math.trunc(f)):f.toFixed(2);
}

/* 🔴 БУЛО: кнопки «Обрати Basic/Premium» кликали act('buy_basic'), а
   SHELL_TABS.buy_basic='s-profile' → go('s-profile') просто закривало
   шторку й показувало вкладку профілю. WayForPay НІКОЛИ не відкривався.
   Людина тиснула «Обрати Basic» — і нічого не купляла.
   ТЕПЕР: payPlan() бере готове платіжне посилання з того самого payload
   (_build_paywall_url уже кладе basic_pay/prem_pay/basic_6m_pay/prem_6m_pay),
   відкриває WayForPay напряму — так само, як робить мініап APPS['s-profile']. */
function payPlan(plan){
  const D=PAYLOAD['s-profile']||{};
  const m={basic:[D.basic_pay,D.basic_link],premium:[D.prem_pay,D.prem_link],
    basic_6m:[D.basic_6m_pay,D.basic_6m_link],premium_6m:[D.prem_6m_pay,D.prem_6m_link]}[plan]||[];
  const link=(m[0]||m[1]||'').trim();
  if(!link){
    toast('Оплата тимчасово недоступна — спробуй пізніше');
    act('paywall_pay_link_missing',{plan});
    return;
  }
  try{ TG?.openLink?.(link) || window.open(link,'_blank'); }catch(e){ window.open(link,'_blank'); }
  act('paywall_buy',{plan,source:D.source||'landing'});
}

let chdRecStream=null, chdRecorder=null, chdRecChunks=[], chdRecording=false, chdRecBlob=null;
let chdRecKind='voice';

function chdSetKind(k){

  chdRecKind=k;

async function chdToggleRecord(){
  const btn=$('#chd-rec-btn'), msg=$('#chd-rec-msg');
  if(chdRecording){
    try{ chdRecorder?.stop(); }catch(e){}
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    if(msg) msg.textContent='Запис недоступний у цьому браузері';
    return;
  }
  try{
    chdRecStream=await navigator.mediaDevices.getUserMedia({audio:true, video:chdRecKind==='video'});
  }catch(e){
    if(msg) msg.textContent='Немає доступу до '+(chdRecKind==='video'?'камери/мікрофона':'мікрофона');
    return;
  }
  chdRecChunks=[];
  chdRecorder=new MediaRecorder(chdRecStream);
  chdRecorder.ondataavailable=e=>chdRecChunks.push(e.data);
  chdRecorder.onstop=()=>{
    chdRecording=false;
    if(btn){ btn.textContent='🎙 Записати'; btn.style.background='var(--purple)'; }
    try{ chdRecStream?.getTracks().forEach(t=>t.stop()); }catch(e){}
    chdRecBlob=new Blob(chdRecChunks,{type:chdRecKind==='video'?'video/webm':'audio/webm'});
    const url=URL.createObjectURL(chdRecBlob);
    const media=$('#chd-rec-media'), box=$('#chd-rec-playback');
    if(media){ media.src=url; media.muted=false; }
    if(box) box.style.display='flex';
    if(msg) msg.textContent='Прослухай себе — і збережи, якщо задоволена';
  };
  chdRecorder.start();
  chdRecording=true;
  if(btn){ btn.textContent='⏹ Зупинити'; btn.style.background='var(--red)'; }
  if(msg) msg.textContent='Записую… натисни ще раз, щоб зупинити';
  /* Автостоп 8 сек — щоб не записувати випадково довго */
  setTimeout(()=>{ if(chdRecording) try{ chdRecorder.stop(); }catch(e){} }, 8000);
}

function chdBlobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onloadend=()=>{ const s=r.result||''; resolve(s.split(',')[1]||''); };
    r.onerror=reject;
    r.readAsDataURL(blob);
  });
}

/* ══════════ SHADOW-МОДУЛІ ══════════ */
async function mountApp(id,host,pk){
  if(mounted[id]) return mounted[id];
  let d={}; if(pk) d=await load(pk);
  host.innerHTML='';
  const sh=host.attachShadow({mode:'open'});
  const st=document.createElement('style');
  /* height:100vh усередині модуля виштовхує навігацію — гасимо */
  st.textContent=TOKENS+'\n:host{display:block;height:100%;overflow:hidden}\n'
    +APPS[id].css
    +'\nhtml,body{height:100%!important;overflow:hidden!important}'
    +'\n.screen{height:100%!important}';
  sh.appendChild(st);
  const wr=document.createElement('div');
  wr.style.cssText='height:100%;overflow:hidden';
  wr.innerHTML=APPS[id].html; sh.appendChild(wr);

  /* Мініап читає свій context із location.search (відео-практика, чек-ін).
     Оболонка підміняє search на '?d=…' — тож ЗОВНІШНІ параметри треба
     прокинути сюди, інакше ?context=video до мініапа не дійде і він
     стартує без відео. Мовчазна поломка — саме те, що ловимо. */
  let q='';
  try{
    const out=new URLSearchParams();
    if(Object.keys(d).length) out.set('d', JSON.stringify(d));
    const inc=new URLSearchParams(location.search);
    inc.forEach((v,k)=>{ if(k!=='s' && k!=='d') out.set(k,v); });
    const s=out.toString();
    q = s ? '?'+s : '';
  }catch(e){
    q = Object.keys(d).length?'?d='+encodeURIComponent(JSON.stringify(d)):'';
  }
  const fL=new Proxy(window.location,{get(t,p){if(p==='search')return q;
    const v=t[p];return typeof v==='function'?v.bind(t):v;}});
  const fW=new Proxy(window,{
    get(t,p){if(p==='location')return fL;const v=t[p];return typeof v==='function'?v.bind(t):v;},
    set(t,p,v){
      /* Модулі старого покоління пробували писати window.go/openOv/closeOv.
         Не дозволяємо їм замінити навігацію оболонки після монтування. */
      if(['go','openOv','closeOv','act','switchTab'].includes(String(p)))return true;
      t[p]=v;
      if(p==='onYouTubeIframeAPIReady'&&typeof YT!=='undefined'&&YT.Player){try{v();}catch(e){}}
      return true;}});
  const fD=new Proxy(document,{get(t,p){
    if(p==='getElementById')return i=>sh.getElementById?.(i)||sh.querySelector('#'+CSS.escape(i));
    if(p==='querySelector')return s=>sh.querySelector(s);
    if(p==='querySelectorAll')return s=>sh.querySelectorAll(s);
    if(p==='location')return fL;
    const v=t[p];return typeof v==='function'?v.bind(t):v;}});

  /* Ловимо функції модуля, щоб керувати ним ззовні */
  const box={};
  /* 24.07: КОРІНЬ БАГА «жодна кнопка не працює» — знайдено живим тестом
     у консолі браузера (typeof switchTab === 'undefined' навіть ПІСЛЯ
     монтування мініапу: https://discoveritschool-hub.github.io/... →
     F12 → Console → typeof switchTab, typeof window.switchTab — обидва
     undefined). new Function(...) виконує код APPS[id].js у ПРИВАТНОМУ,
     повністю ізольованому лексичному оточенні цього одного виклику —
     перевірено ще й окремо в Node (verify.js/verify2.js): top-level
     `function foo(){}` усередині new Function НІКОЛИ не потрапляє в
     жоден зовнішній об'єкт, навіть якщо викликати .call(window,...) чи
     передати `window` явним параметром. Це фундаментальна властивість
     Function-конструктора, не щось, що можна обійти зміною виклику.

     Але inline onclick="switchTab(...)" у розмітці (HTML) завжди шукає
     ім'я функції в ГЛОБАЛЬНОМУ window сторінки — поведінка браузера,
     яку змінити не можна. Тому жодна функція мініапу (switchTab, shareTg,
     copyLink, setRecMode, десятки інших — усі, крім явно експортованих
     у __box) фізично не могла спрацювати по кліку. Стосувалось УСІХ
     Shadow-DOM мініапів одразу (ov-invite, ov-player, s-buddy,
     ov-diagnostic, ov-onboarding), не одного екрана.

     Робоче виправлення (перевірено в Node — verify3.js): знаходимо
     регуляркою всі top-level `function name(...)` і `async function
     name(...)` оголошення в тексті коду модуля, і дописуємо в кінець
     явні рядки `try{window.name=name;}catch(e){}`. Ці рядки виконуються
     в ТОМУ САМОМУ лексичному scope, де функції вже оголошені (просто
     нижче в тексті) — тому мають до них прямий доступ і кладуть їх у
     параметр window, яким передаємо справжній fW-проксі (той самий, що
     вже спрямовує document.getElementById у Shadow Root). Це не міняє
     жодної існуючої поведінки geturi/querySelector — лише додає раніше
     відсутній місток між приватним scope модуля і window сторінки. */
  /* YouTube's API resolves a string id through the real document, which
     cannot see elements inside this Shadow DOM. Pass the actual element for
     the embedded player module. */
  let moduleJs=APPS[id].js;
  if(id==='ov-player'){
    moduleJs=moduleJs.replace(
      /new\s+YT\.Player\((['"])yt-player\1\s*,/g,
      'new YT.Player(document.getElementById("yt-player"),'
    );
  }
  try{
    new Function('document','window','location','__box',
      moduleJs
      +'\n;__box.__dispatch=function(code,event,element){'
      +'const m=String(code||"").trim().match(/^act\\(([\\\'\\\"])([^\\\'\\\"]+)\\1(?:\\s*,\\s*([\\s\\S]*))?\\)$/);'
      +'if(m&&typeof window.__shellAct==="function"){let p={};if(m[3]){try{p=eval("("+m[3]+")")}catch(e){}}return window.__shellAct(m[2],p)}'
      +'return (function(){return eval(code)}).call(element)};'
      +'\n;try{Object.assign(__box,{openScenario:typeof openScenario!=="undefined"?openScenario:0,'
      +'startChainyChat:typeof startChainyChat!=="undefined"?startChainyChat:0,'
      +'openMySituation:typeof openMySituation!=="undefined"?openMySituation:0,'
      +'selectRole:typeof selectRole!=="undefined"?selectRole:0,'
      +'showScreen:typeof showScreen!=="undefined"?showScreen:0,'
      +'openTopic:typeof openTopic!=="undefined"?openTopic:0,'
      +'startVideoChat:typeof startVideoChat!=="undefined"?startVideoChat:0,'
      +'resetInactivity:typeof resetInactivity!=="undefined"?resetInactivity:0,'
      +'clearInactivityTimers:typeof clearInactivityTimers!=="undefined"?clearInactivityTimers:0,'
      +'endSession:typeof endSession!=="undefined"?endSession:0});}catch(e){}'
    )(fD,fW,fL,box);
  }catch(e){ console.warn('['+id+']',e.message); }
  /* Inline-кнопки кожного модуля виконуються у ВЛАСНІЙ області.
     Інакше однойменні act()/switchTab() з різних екранів перезаписувалися. */
  sh.addEventListener('click',e=>{
    const node=e.target&&e.target.closest?e.target.closest('[onclick]'):null;
    if(!node||!sh.contains(node)||!box.__dispatch)return;
    const code=node.getAttribute('onclick');if(!code)return;
    e.preventDefault();e.stopImmediatePropagation();
    try{box.__dispatch(code,e,node);}catch(err){console.warn('['+id+' click]',err.message);}
  },true);
  mounted[id]=box;
  return box;
}

/* Головна кнопка «назад»: спершу закриває оверлей, потім вертає екран.
   v13.2: якщо CHD_RETURN_DAY встановлено (людина зайшла сюди з екрана
   челенджу), кожна гілка перевіряє це ПЕРЕД тим, як завершитись — так
   «назад» повертає на День N незалежно від того, чи ми йшли на вкладку
   (Прогрес/Лідерборд), чи на інший оверлей (Словник). */
function goBack(){
  const ov=$('.overlay.on');
  if(ov){
    closeOv();
    if(CHD_RETURN_DAY){ const d=CHD_RETURN_DAY; CHD_RETURN_DAY=null; openOv('ov-challenge'); }
    return;
  }
  if(HIST.length){

    if(dest==='s-home' && CHD_RETURN_DAY){ const d=CHD_RETURN_DAY; CHD_RETURN_DAY=null; openOv('ov-challenge'); }
    return;
  }
  if(CUR!=='s-home'){
    go('s-home', true);
    if(CHD_RETURN_DAY){ const d=CHD_RETURN_DAY; CHD_RETURN_DAY=null; openOv('ov-challenge'); }
    return;
  }
  try{ TG?.close(); }catch(e){}
}

/* ══ ЗАКРИТТЯ СЕСІЇ CHAINY ══
   У standalone-файлі сесію закривав `pagehide` / `visibilitychange`.
   В оболонці мініап живе в Shadow DOM ТІЄЇ САМОЇ сторінки — тож при
   переході на іншу вкладку жодна з цих подій не стріляє.
   Наслідок: /buddy_session_end не викликався НІКОЛИ → XP, ланка
   й картка перемоги не нараховувались.
   Тут ловимо вихід із s-buddy руками. endSession() усередині мініапа
   має власний захист `beaconSent` — подвійного нарахування не буде. */
function leaveBuddy(){
  try{
    const b = mounted['s-buddy'];
    if(b && typeof b.endSession === 'function') b.endSession();
    if(b && typeof b.clearInactivityTimers === 'function') b.clearInactivityTimers();
  }catch(e){ console.warn('leaveBuddy', e.message); }
}

async function go(sid, isBack, fromHistory){
  sid=SCREEN_ALIASES[sid]||sid;
  if(!R[sid]){
    console.warn('Unknown screen:',sid);
    sid='s-home';
  }
  if(sid===CUR && !isBack) return;
  /* Ідемо ГЕТЬ із Chainy → закриваємо сесію (XP + ланка + картка) */
  if(CUR==='s-buddy' && sid!=='s-buddy') leaveBuddy();
  if(!isBack && CUR) HIST.push(CUR);
  CUR=sid;

  $$('.screen').forEach(s=>s.classList.remove('on'));
  $$('.nav button').forEach(b=>b.classList.remove('on'));
  $('#'+sid).classList.add('on');
  const b=$('.nav button[data-s="'+sid+'"]'); if(b)b.classList.add('on');
  try{const sc=$('.scroll'); if(sc)sc.scrollTop=0;}catch(e){}

  syncTop(sid);
  /* «Назад» показуємо скрізь, крім Сьогодні */
  tgBack(sid!=='s-home' || HIST.length>0);

  if(R[sid]) await R[sid]();
  if(BROWSER_NAV&&!fromHistory){
    const initial=!history.state?.speakchain;

/* Свайп ліворуч/праворуч між вкладками */
(function swipe(){
  const sc=$('.scroll'); if(!sc) return;
  let x0=null,y0=null,t0=0;
  sc.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now();
  },{passive:true});
  sc.addEventListener('touchend',e=>{
    if(x0===null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    x0=null;
    /* Тільки чіткий горизонтальний свайп, не скрол */
    if(dt>600 || Math.abs(dx)<70 || Math.abs(dx)<Math.abs(dy)*2) return;
    if($('.overlay.on')) return;
    const i=TABS.indexOf(CUR);
    if(i<0) return;
    const j=dx<0 ? i+1 : i-1;
    if(j<0||j>=TABS.length) return;
    HIST.length=0;
    go(TABS[j]);
  },{passive:true});
})();

/* ══════════ ОВЕРЛЕЇ ══════════ */
async function openOv(id, fromHistory){
  id=SCREEN_ALIASES[id]||id;
  const ov=$('#'+id);
  if(!ov){
    console.warn('Unknown overlay:',id);
    await go('s-home');
    return;
  }
  /* Оверлей поверх Chainy — людина фактично пішла з чату. Закриваємо сесію. */
  if(CUR==='s-buddy') leaveBuddy();
  $$('.overlay').forEach(o=>o.classList.remove('on'));
  ov.classList.add('on');
  if(BROWSER_NAV&&!fromHistory) commitBrowserState(CUR,id,false);
  tgBack(true);
  const M={'ov-vocab':['ov-vocab',null],'ov-invite':['ov-invite','ov-invite']};
  if(M[id]){const[a,p]=M[id]; await mountApp(a,$('#'+id+'-host'),p); return;}
  if(id==='ov-rating'){ await load('s-social'); renderRating(); }
  if(id==='ov-plans'){ await load('s-profile'); renderPlans(); }
  if(id==='ov-challenge'){ await load('ov-challenge'); renderChallenge(); }
  if(id==='ov-diagnostic'){ await mountApp('ov-diagnostic',$('#ov-diagnostic-host'),null); }
  if(id==='ov-onboarding'){ await mountApp('ov-onboarding',$('#ov-onboarding-host'),null); }
}
function closeOv(fromHistory){
  const wasPlayer = $('#ov-player')?.classList.contains('on');
  const wasBuddy = $('#ov-buddy')?.classList.contains('on');
  const wasCompose = $('#ov-social-compose')?.classList.contains('on');
  const wasLive = $('#ov-live-match')?.classList.contains('on');
  if(wasPlayer){
    const frame=$('#ov-player-host iframe');
    if(frame) frame.src='about:blank'; /* stop audio/video immediately */
    const host=$('#ov-player-host'); if(host) host.innerHTML='';
    const mp=$('#mini-player'); if(mp)mp.classList.remove('on');
  }
  if(wasBuddy){
    CHAINY_COMPOSE_OBSERVER?.disconnect();CHAINY_COMPOSE_OBSERVER=null;
    $('#chainy-compose-nudge')?.classList.remove('on');
    try{
      const b=mounted['s-buddy'];
      if(b&&typeof b.endSession==='function') b.endSession();
    }catch(e){}
  }
  if(wasCompose)stopComposeMedia();
  if(wasLive){
    clearInterval(LIVE_POLL);clearInterval(LIVE_TIMER_INT);
    try{LIVE_STREAM?.getTracks().forEach(t=>t.stop());}catch(e){}
    if(LIVE_MATCH){socialApi('live_leave').catch(()=>{});LIVE_MATCH=null;}
  }
  $$('.overlay').forEach(o=>o.classList.remove('on'));
  tgBack(CUR!=='s-home' || HIST.length>0);
  /* Вийшли з плеєра — пропонуємо ГОВОРИТИ про те, що щойно дивились.
     Слухати без говоріння не дає прогресу. Маршрут «відео → Chainy»
     (startVideoChat) уже існує в мініапі — але його ніхто не кликав. */
  if(wasPlayer) offerSpeak();
  if(wasBuddy){
    trackUx('chainy_session_close');
    setTimeout(showChainyRecap,1200);
  }
  if(BROWSER_NAV&&!fromHistory&&history.state?.speakchain&&history.state?.overlay){
    try{history.back();}catch(e){}
  }
}

window.addEventListener('popstate',event=>{
  if(!BROWSER_NAV)return;
  const state=event.state;
  if(!state?.speakchain)return;
  if(state.overlay){ openOv(state.overlay,true); return; }
  closeOv(true);
  go(state.screen||'s-home',true,true);
});

async function showChainyRecap(){
  delete PAYLOAD['s-buddy']; delete PENDING['s-buddy'];
  const d=await load('s-buddy');
  const recap=d.recap||{};
  const phrases=(recap.target||d.recent_phrases||[]).slice(0,3);
  const used=Number(recap.used_count||0);
  const sub=$('#chainy-recap-sub');
  if(sub) sub.textContent=phrases.length
    ? ('Ти використала '+used+' із '+phrases.length+' фраз. '
      +(used===phrases.length?'Усі закріплено в живій розмові 🎉':'Решта чекає на повторення у словнику.'))
    : 'Контекст збережено — наступного разу Chainy продовжить звідси.';
  const el=$('#chainy-recap');
  if(!el)return;
  el.style.display='';
  setTimeout(()=>el.classList.add('on'),30);
}
function hideChainyRecap(){

}

/* Місток «подивилась → поговори». Показуємо ОДИН раз за сесію,
   щоб не набридати: набридливий продукт видаляють. */
let SPOKE_OFFERED = false;
function offerSpeak(){
  if(SPOKE_OFFERED) return;
  /* Поле last_video_title бекенд віддає в payload s-home (додано разом
     із цією правкою). Якщо його немає — старий бот, показуємо загальний
     текст замість того, щоб мовчати. */
  const t = (PAYLOAD['s-home']?.last_video_title || '').trim();
  const el = $('#speak-nudge');
  if(!el) return;
  SPOKE_OFFERED = true;
  $('#speak-nudge-s').textContent = t
    ? ('Обговори «' + (t.length>40 ? t.slice(0,40)+'…' : t) + '» з Chainy')
    : 'Скажи своїми словами — це і є прогрес';
  el.style.display = '';
  setTimeout(()=>{ el.classList.add('on'); }, 30);
}
async function speakNow(){
  const el = $('#speak-nudge');
  if(el){ el.classList.remove('on'); setTimeout(()=>{ el.style.display='none'; }, 250); }
  HIST.length = 0;

  /* 🔴 БУЛО: go('s-buddy') самотнім — відкривало ЗАГАЛЬНИЙ вибір сценарію.
     Банер щойно сказав «Обговори «X» з Chainy», людина тиснула кнопку —
     і потрапляла на порожній екран категорій, де про X немає й натяку.
     startVideoChat уже вміє відкрити готове обговорення відео
     (той самий код, що працює для ?context=video&topic=&vid= з плеєра
     переходу через бота) — просто ніхто не викликав її звідси напряму.

     Тепер: якщо є назва останнього відео — відкриваємо ОДРАЗУ обговорення
     цього відео. Якщо назви немає (старий бот без last_video_id) —
     звичайний s-buddy, як було. */
  const brief = conversationBrief();
  const title = brief.title.trim();
  delete PAYLOAD['s-buddy']; delete PENDING['s-buddy'];
  await go('s-buddy');
  const phrases = brief.phrases;
  if (title) {
    try {
      await cyLaunch(box=>{
        if (box && typeof box.startVideoChat === 'function') {
          trackUx('video_chainy_cycle_start',{phrases:phrases.length});
          box.startVideoChat(brief);
        }
      });
    } catch(e) { console.warn('speakNow startVideoChat', e.message); }
  } else {
    await cyChat();
  }
}
function speakLater(){
  const el = $('#speak-nudge');
  if(el){ el.classList.remove('on'); setTimeout(()=>{ el.style.display='none'; }, 250); }
}

/* ══ ЗВІТ ПРО ПОМИЛКИ ══
   /err_fix у боті існує й чекає на звіти — але його НІХТО не кликав.
   Коли JS у мініапі падає, власниця про це не дізнається ніяк:
   прод на GitHub Pages, консолі користувача ніхто не бачить.
   Тепер падіння летить у лог бота. Нічого не пише в базу — діагностика. */
(function errReport(){
  let sent = 0;                       /* не більше 3 звітів за сесію — не спамимо */
  function report(msg, src){
    if(sent >= 3 || !msg) return;
    sent++;
    try{
      fetch(BOT_API + '/err_fix', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          uid:    UID,
          error:  String(msg).slice(0, 500),
          source: (src || CUR || 'shell'),
        }),
        keepalive: true,
      }).catch(()=>{});
    }catch(e){}
  }
  window.addEventListener('error', e=>{
    report((e.message||'') + ' @ ' + (e.filename||'').split('/').pop() + ':' + (e.lineno||0));
  });
  window.addEventListener('unhandledrejection', e=>{
    report('promise: ' + (e.reason?.message || e.reason || 'unknown'));
  });
  window.SC_report = report;          /* мініапи можуть кликати самі */
})();

// 22.07: повний екран (Bot API 8.0+). Прибирає верхню системну панель
// Telegram — застосунок займає весь екран. try/catch і typeof-перевірка,
// бо старі клієнти Telegram цей метод ще не підтримують — тоді просто

try{ if(TG && typeof TG.requestFullscreen==='function') TG.requestFullscreen(); }catch(e){}

// 22.07: safe area в fullscreen — Bot API 8.0+.
//
// ⚠️ CSS env(safe-area-inset-*) НЕ ПРАЦЮЄ всередині Telegram Mini Apps
// (підтверджений баг: github.com/TelegramMessenger/Telegram-iOS/issues/1377).
// Той env(), що вже був у .scroll/.nav — тихо нічого не робив і раніше;
// у звичайному режимі це не було критично (Telegram сам займав верх/низ),
// але в requestFullscreen() застосунок сам відповідає за весь екран —
// без цього фіксу нижня навігація може напливати на зону жестів телефону,
// а зверху лишається або порожнеча, або контент під вирізом камери.
//
// Рішення: Telegram сам пише актуальні відступи у свої CSS-змінні
// (--tg-safe-area-inset-top/bottom, --tg-content-safe-area-inset-top/bottom).
// Підписуємось на їхню зміну (поворот екрана, зміна fullscreen-стану) і
// прокидуємо в НАШІ змінні, які реально використовує CSS нижче.
function _syncSafeArea(){
  try{
    var r = document.documentElement.style;
    var css = getComputedStyle(document.documentElement);
    var top    = css.getPropertyValue('--tg-content-safe-area-inset-top')    || css.getPropertyValue('--tg-safe-area-inset-top')    || '0px';
    var bottom = css.getPropertyValue('--tg-content-safe-area-inset-bottom') || css.getPropertyValue('--tg-safe-area-inset-bottom') || '0px';
    r.setProperty('--sc-safe-top', top.trim() || '0px');
    r.setProperty('--sc-safe-bottom', bottom.trim() || '0px');
  }catch(e){}
}
if(TG){
  try{
    if (typeof TG.requestSafeAreaInsets === 'function') TG.requestSafeAreaInsets();
    if (typeof TG.requestContentSafeAreaInsets === 'function') TG.requestContentSafeAreaInsets();
    if (typeof TG.onEvent === 'function'){
      TG.onEvent('safeAreaChanged', _syncSafeArea);
      TG.onEvent('contentSafeAreaChanged', _syncSafeArea);
      TG.onEvent('fullscreenChanged', _syncSafeArea);
    }
  }catch(e){}
}
_syncSafeArea();
setMode('active');

// 22.07: ховаємо skeleton — реальний контент готовий (setMode відмалював
// перший екран, _syncSafeArea прочитав відступи). rAF×2, той самий трюк,
// що вже використовується в оболонці для scroll-hint: перший кадр ставить
// у чергу, другий гарантує, що layout уже готовий — без цього fade-out
// міг би зачепити ще не відмальований контент.
(function _hideSkeleton(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const sk = document.getElementById('sc-skeleton');
    if (sk) {
      sk.classList.add('hide');
      setTimeout(() => { try { sk.remove(); } catch(e){} }, 300);
    }
  }));
})();

/* ══ ВХІД НА КОНКРЕТНИЙ ЕКРАН ══
   Кнопки в чаті раніше вели на окремі .html (speaking_buddy.html і т.д.).
   Ті файли прибрано → кнопки давали 404, а «Open» працював.
   Тепер бот шле сюди ?s=s-buddy (або start_param=s-buddy з deep-link),
   і ми відкриваємо потрібний екран замість «Сьогодні».
   Невідомий ключ ігноруємо — тоді поводимось як раніше. */
const START = (function(){
  try{
    const q = new URLSearchParams(location.search).get('s');
    if(q) return SCREEN_ALIASES[q]||q;
    const sp = TG?.initDataUnsafe?.start_param || '';
    if(sp.indexOf('s-') === 0 || sp.indexOf('ov-') === 0)
      return SCREEN_ALIASES[sp]||sp;   /* лише наші ключі, не ref_… */
  }catch(e){}
  return '';
})();

/* v13.1: START тепер розуміє й ОВЕРЛЕЇ (ov-vocab, ov-invite), не лише
   5 вкладок з TABS. Раніше нагадування про повторення слів чи запрошення
   друга не могли вести прямо туди — доводилось відкривати загальну
   вкладку або лишати старий чат-флоу. ov-player 23.07: тепер входить — video_watch_keyboard() у боті шле сюди ?v=
   з відео, openPlayer() читає його з location.search на старті. */
const OVERLAY_START_KEYS = [
  'ov-vocab','ov-invite','ov-challenge','ov-player',
  'ov-diagnostic','ov-onboarding'
];
(async function bootSpeakChain(){
  // In an installed PWA, refresh the short access token before the first
  // payload request. Telegram Mini App resolves immediately through initData.
  try{
    const auth = await window.SC_PWA?.ready;
    if(auth?.userId) UID=Number(auth.userId);
  }catch(e){}
  if (START === 'ov-player') {
    await go('s-home');
    await openPlayer();
  } else if (OVERLAY_START_KEYS.indexOf(START) >= 0) {
    await go('s-home');
    await openOv(START);
  } else {
    await go(R[START] ? START : 's-home');
    if(START==='s-social'&&new URLSearchParams(location.search).get('invite')){
      SOCIAL_TAB='challenges';
      setTimeout(()=>socialTab('challenges'),350);
    }
  }
  setTimeout(scWatchAll,300);
})();
window.addEventListener('resize',scWatchAll);
