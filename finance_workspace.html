<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpeakChain · Фінанси</title><link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#0d0d14);color:var(--text,#eaeaf5);font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:center;padding:14px 18px;background:rgba(13,13,20,.94);border-bottom:1px solid var(--line,#2a2a3a)}header div{flex:1}h1{font-size:18px;margin:0}.sub,.muted{font-size:12px;color:var(--text2,#8888a8)}select,button{font:inherit;padding:9px 11px;border:1px solid var(--line,#2a2a3a);border-radius:10px;background:var(--bg-card2,#1e1e2a);color:var(--text,#eaeaf5)}button{cursor:pointer}main{max-width:1050px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{padding:15px;border:1px solid var(--line,#2a2a3a);border-radius:14px;background:var(--bg-card,#16161f)}.value{font-size:23px;font-weight:800;margin-top:6px}.section{margin-top:14px}.section h2{font-size:15px;margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line,#2a2a3a)}th{color:var(--text2,#8888a8)}.error{padding:15px;border:1px solid #f76e6e;border-radius:12px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}header{flex-wrap:wrap}header select{width:100%}main{padding:12px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style><script src="pwa.js?v=20260806-staff1"></script></head><body>
<header><div><h1>💼 Фінансовий директор / бухгалтер</h1><div class="sub">Доходи, витрати, податки, виплати й звітність</div></div><select id="workspace-mode" onchange="switchMode()"><option value="finance">💼 Фінанси</option><option value="learner">🎓 Режим учня</option></select><button onclick="loadFinance()">↻</button></header>
<main id="content"><div class="card">Завантаження…</div></main>
<script>
const $=s=>document.querySelector(s), money=v=>'$'+Number(v||0).toLocaleString('uk-UA',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openLearnerMode(){location.assign(new URL('index_v2.html',location.href).toString())}function switchMode(){const mode=$('#workspace-mode').value;if(mode==='learner')openLearnerMode();if(mode==='admin')location.assign(new URL('admin_analytics.html',location.href).toString())}
if(new URLSearchParams(location.search).get('from')==='admin')$('#workspace-mode').insertAdjacentHTML('afterbegin','<option value="admin">👑 Режим адміна</option>');
function metric(label,value,note=''){return `<div class="card"><div class="muted">${esc(label)}</div><div class="value">${esc(value)}</div>${note?`<div class="muted">${esc(note)}</div>`:''}</div>`}
async function loadFinance(){const box=$('#content');box.innerHTML='<div class="card">Завантаження…</div>';try{const data=await SC_PWA.post('/admin_analytics',{});if(data.error)throw new Error(data.error);const f=data.finance||{},r=data.revenue||{},b=data.bloggers||{},summary=f.summary||f;const revenue=summary.revenue??r.revenue_month??0,expenses=summary.expenses??summary.total_expenses??0,tax=summary.tax??summary.tax_amount??0,net=summary.net??summary.profit??(revenue-expenses-tax);const payouts=b.payout_log||[];box.innerHTML=`<div class="grid">${metric('Дохід за місяць',money(revenue))}${metric('Витрати',money(expenses))}${metric('Податки',money(tax))}${metric('Чистий результат',money(net))}${metric('MRR',money(r.mrr))}${metric('До виплати блогерам',money(b.unpaid_all_total))}${metric('Виплачено блогерам',money(b.total_paid_out))}${metric('Платних користувачів',(r.basic_count||0)+(r.premium_count||0))}</div><section class="card section"><h2>Останні виплати блогерам</h2>${payouts.length?`<table><tr><th>Дата</th><th>Блогер</th><th>Сума</th><th>Примітка</th></tr>${payouts.map(p=>`<tr><td>${esc(p.date||'—')}</td><td>${esc(p.blogger||p.name||'—')}</td><td>${money(p.amount)}</td><td>${esc(p.note||'')}</td></tr>`).join('')}</table>`:'<div class="muted">Записів про виплати ще немає.</div>'}</section>`}catch(e){box.innerHTML='<div class="error">Не вдалося відкрити фінансові дані: '+esc(e.message)+'</div>'}}
loadFinance();
</script></body></html>
